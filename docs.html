const FLOW = {
  curl: `# 1) Khách đưa số điện thoại → hiện điểm
curl "{{BASE}}/account?customer_ref=0901234567" ${KEY}

# 2) Chốt đơn → cộng điểm (an toàn khi gọi lại)
curl -X POST {{BASE}}/sales ${KEY} -H "Content-Type: application/json" \\
  -d '{"idempotency_key":"pos:HD001","customer_ref":"0901234567","source_type":"pos","source_ref":"HD001","amount_minor":250000}'

  js: `const API = "{{BASE}}";
const KEY = "lsk_YOUR_KEY";

async function call(path, body) {
  const res = await fetch(API + path, {
    method: body ? "POST" : "GET",
    headers: { Authorization: \`Bearer \${KEY}\`, "Content-Type": "application/json" },
    body: body && JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error);   // { error: "..." }
  return data;
}

// Chốt đơn: cộng điểm. Mạng lỗi? Cứ gọi lại, không bao giờ cộng trùng.
const sale = await call("/sales", {
  idempotency_key: "pos:HD001", customer_ref: "0901234567",
  source_type: "pos", source_ref: "HD001", amount_minor: 250000,
});
console.log("Đã cộng", sale.entry.points_delta, "điểm; lượt quay mới:", sale.entitlements?.length ?? 0);

});
console.log("Còn", redeem.balance, "điểm");`,
  py: `import requests

API = "{{BASE}}"
HEADERS = {"Authorization": "Bearer lsk_YOUR_KEY"}

def call(path, body=None):
    r = requests.request("POST" if body else "GET", API + path, headers=HEADERS, json=body, timeout=10)
    data = r.json()
    if not r.ok:
        raise RuntimeError(data["error"])
    return data

sale = call("/sales", {
    "idempotency_key": "pos:HD001", "customer_ref": "0901234567",
    "source_type": "pos", "source_ref": "HD001", "amount_minor": 250000,
})
print("Đã cộng", sale["entry"]["points_delta"], "điểm")

redeem = call("/redemptions", {
    "idempotency_key": "redeem:G001", "customer_ref": "0901234567", "source_ref": "G001", "points": 5,
})
print("Còn", redeem["balance"], "điểm")`,
  php: `<?php
$api = "{{BASE}}"; $key = "lsk_YOUR_KEY";

function call($path, $body = null) {
    global $api, $key;
    $ch = curl_init($api . $path);
    curl_setopt_array($ch, [
        CURLOPT_RETURNTRANSFER => true, CURLOPT_TIMEOUT => 10,
        CURLOPT_HTTPHEADER => ["Authorization: Bearer $key", "Content-Type: application/json"],
    ]);
    if ($body) { curl_setopt($ch, CURLOPT_POST, true); curl_setopt($ch, CURLOPT_POSTFIELDS, json_encode($body)); }
    $data = json_decode(curl_exec($ch), true);
    if (curl_getinfo($ch, CURLINFO_HTTP_CODE) >= 400) throw new Exception($data["error"]);
    return $data;
}

$sale = call("/sales", [
    "idempotency_key" => "pos:HD001", "customer_ref" => "0901234567",
    "source_type" => "pos", "source_ref" => "HD001", "amount_minor" => 250000,
]);
echo "Đã cộng " . $sale["entry"]["points_delta"] . " điểm";`,

  <ul><li>Dùng khóa ổn định theo nghiệp vụ: <code>pos:&lt;mã hóa đơn&gt;</code>, <code>redeem:&lt;mã đổi thưởng&gt;</code>.</li>
  <li>Dùng lại một khóa cho yêu cầu <b>khác nội dung</b> sẽ báo lỗi 409.</li>
  <li>Mã hóa đơn (<code>source_ref</code>) cũng chỉ được cộng một lần, kể cả khi khóa khác nhau.</li></ul>
</section>`);
sections.push(`<section class="doc-section" id="conventions"><h2>Quy ước</h2>
  <ul><li>Tiền tệ là VND, gửi dạng <b>số nguyên</b> (<code>amount_minor</code>). Điểm cũng là số nguyên.</li>
  <li>Thời gian theo ISO 8601 (UTC). Số trả về là <b>number</b> (không phải chuỗi).</li>
  <li><code>customer_ref</code> là số điện thoại hoặc mã khách tùy bạn chọn — hãy dùng nhất quán.</li>
  <li>Lỗi trả về dạng <code>{ "error": "thông báo" }</code> kèm mã HTTP phù hợp.</li></ul>
</section>`);

for (const g of GROUPS) {
  sections.push(`<section class="doc-section" id="${g.id}"><h2 class="mb-3">${g.title}</h2>${g.endpoints.map(e => `
    <article class="card ep" id="${e.id}">
      <div class="card-header"><span class="method m-${e.m.toLowerCase()}">${e.m}</span><span class="ep-path">${esc(e.path)}</span><span class="ms-auto text-secondary d-none d-md-inline">${e.title}</span></div>
      <div class="card-body">
        <p class="mb-2">${e.desc}</p>
        ${e.params.length ? `<div class="label-sm">Tham số</div><div class="table-responsive"><table class="table table-sm param-table"><thead><tr><th>Tên</th><th>Kiểu</th><th>Mô tả</th></tr></thead><tbody>${e.params.map(([n, t, r, d]) => `<tr><td><code>${n}</code> ${r ? '<span class="req">bắt buộc</span>' : ''}</td><td class="text-secondary">${t}</td><td>${d}</td></tr>`).join('')}</tbody></table></div>` : ''}
        <div class="label-sm">Ví dụ yêu cầu</div>${code(e.curl)}
        <div class="label-sm">Phản hồi <span class="text-secondary" style="text-transform:none;letter-spacing:0;font-weight:500">· ${e.status}</span></div>${code(JSON.stringify(e.res, null, 2))}
      </div></article>`).join('')}</section>`);
}
sections.push(`<section class="doc-section" id="flow"><h2>Luồng mẫu cho POS</h2>
  <p>Ba bước thường gặp tại quầy: tra điểm → cộng điểm khi chốt đơn → đổi điểm. Chọn ngôn ngữ:</p>
  <ul class="nav nav-pills tabs-pill mb-3" data-bs-toggle="tabs">${Object.keys(FLOW).map((k, i) => `<li class="nav-item"><a class="nav-link ${i ? '' : 'active'}" href="#flow-${k}" data-bs-toggle="tab">${{ curl: 'curl', js: 'JavaScript', py: 'Python', php: 'PHP' }[k]}</a></li>`).join('')}</ul>
  <div class="tab-content">${Object.entries(FLOW).map(([k, v], i) => `<div class="tab-pane ${i ? '' : 'active show'}" id="flow-${k}">${code(v)}</div>`).join('')}</div>
</section>`);
sections.push(`<section class="doc-section" id="errors"><h2>Mã lỗi</h2>
  <div class="card"><div class="table-responsive"><table class="table table-vcenter card-table"><thead><tr><th style="width:70px">HTTP</th><th>Ý nghĩa</th><th>Ví dụ thông báo</th></tr></thead><tbody>${ERRORS.map(([c, m, e]) => `<tr><td><b>${c}</b></td><td>${m}</td><td class="small">${e}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="callout mt-3"><b>Mẹo:</b> lỗi 5xx hoặc timeout → gọi lại với <b>cùng</b> <code>idempotency_key</code>. Lỗi 4xx (trừ 401) là lỗi nghiệp vụ, gọi lại sẽ cho kết quả y hệt.</div>
</section>`);
document.getElementById('doc').innerHTML = sections.join('');
document.getElementById('base-url').textContent = BASE;
function copyBase(btn) { navigator.clipboard.writeText(BASE); btn.textContent = 'Đã chép'; setTimeout(() => btn.textContent = 'Sao chép', 1400); }

/* Mục lục + đánh dấu mục đang xem */
const toc = [['Giới thiệu', 'intro'], ['Xác thực', 'auth'], ['Chống trùng', 'idempotency'], ['Quy ước', 'conventions']];
let html = toc.map(([t, id]) => `<a href="#${id}">${t}</a>`).join('');
for (const g of GROUPS) html += `<div class="grp">${g.title}</div>` + g.endpoints.map(e => `<a href="#${e.id}"><span class="method m-${e.m.toLowerCase()}" style="min-width:44px;font-size:.62rem;margin-right:.4rem">${e.m}</span>${e.title}</a>`).join('');
html += `<div class="grp">Khác</div><a href="#flow">Luồng mẫu cho POS</a><a href="#errors">Mã lỗi</a>`;
document.getElementById('toc').innerHTML = html;
const links = [...document.querySelectorAll('#toc a')];
const spy = new IntersectionObserver(entries => entries.forEach(en => {
  if (en.isIntersecting) links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id));
}), { rootMargin: '-90px 0px -70% 0px' });
document.querySelectorAll('.doc-section, .ep').forEach(el => spy.observe(el));
document.addEventListener('click', e => { const b = e.target.closest('.copy-btn'); if (!b) return; navigator.clipboard.writeText(b.parentElement.querySelector('code').textContent); b.textContent = 'Đã chép'; setTimeout(() => b.textContent = 'Sao chép', 1400); });
</script>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
</body>
</html>

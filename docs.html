<script>
const BASE = location.origin.replace(/\/\/[0-9a-f]{8}\.([^/]+\.pages\.dev)/, '//$1') + '/api/v1/loyalty';
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const code = (text, lang = '') => `<pre class="code"><button class="btn btn-sm btn-dark copy-btn" type="button">Copy</button><code>${esc(text.replaceAll('{{BASE}}', BASE))}</code></pre>`;
const KEY = '-H "Authorization: Bearer lsk_YOUR_KEY"';
const entry = (extra) => ({ id: '6c0a7713-…', customer_ref: '0901234567', transaction_type: 'earn', points_delta: 25, amount_minor: 2500, currency: 'USD', source_type: 'pos', source_ref: 'R001', rule_version: 1, idempotency_key: 'pos:R001', occurred_at: '2026-10-08T07:13:59.942Z', ...extra });

/* ---------- Endpoints ---------- */
const CUSTOMER_Q = 'Phone number or customer code (query).';
const CUSTOMER_B = 'Phone number or customer code (in the body).';
const GROUPS = [
  { id: 'webhooks', title: 'Webhooks', endpoints: [
    { id: 'webhook-events', m: 'POST', path: 'Your URL', title: 'Receive events (webhooks)',
      desc: 'Add a URL on the <b>POS integration</b> page. Each event is sent as a JSON <code>POST</code>: <code>{ id, type, created_at, data }</code>. Event types: <code>points.earned</code>, <code>points.redeemed</code>, <code>checkin.completed</code>, <code>spin.issued</code>, <code>reward.won</code>. <b>Verify the signature</b>: header <code>X-Loyalty-Signature: t=&lt;unix&gt;,v1=&lt;hex&gt;</code>, where <code>v1 = HMAC_SHA256(secret, t + "." + body)</code>; reject if <code>t</code> is more than 5 minutes off. Reply 2xx within 5 seconds, otherwise we retry after 1 min, 5 min, 30 min, 2 h and 6 h (6 attempts at most). The same <code>id</code> may arrive more than once — handle it idempotently.',
      params: [],
      curl: `// Node.js\nimport crypto from "node:crypto";\nconst [t, v1] = req.headers["x-loyalty-signature"].split(",").map(p => p.split("=")[1]);\nconst ok = crypto.createHmac("sha256", process.env.WEBHOOK_SECRET).update(t + "." + rawBody).digest("hex") === v1;`,
      status: '2xx reply', res: { id: 'c1f0…', type: 'points.earned', created_at: '2026-11-20T03:12:00.000Z', data: { customer_ref: '0901234567', points: 25, amount_minor: 2500, currency: 'USD', source_ref: 'R001' } } },
  ] },

  { id: 'points', title: 'Points', endpoints: [
    { id: 'post-events', m: 'POST', path: '/events', title: 'Send an event (recommended)',
      desc: 'One endpoint for everything: <code>purchase</code> (add points + earn spins + tickets), <code>redeem</code> (deduct points), <code>checkin</code> (check-in + streak). Missions and challenges compute progress from these events. De-duplicated by the <code>Idempotency-Key</code> header, or by default <code>&lt;type&gt;:&lt;order_id&gt;</code>.',
      params: [['type', 'string', true, '<code>purchase</code> | <code>redeem</code> | <code>checkin</code>.'],
        ['customer_ref', 'string', true, 'Phone number or customer code.'],
        ['order_id', 'string', false, 'Receipt number / redemption code (required for purchase and redeem).'],
        ['amount_minor', 'integer', false, 'Receipt total in the smallest currency unit (purchase).'],
        ['points', 'integer', false, 'Points to deduct (redeem).'],
        ['customer', 'object', false, '<code>{ name, phone }</code> used when creating a new customer.']],
      curl: `curl -X POST {{BASE}}/events ${KEY} \\\n  -H "Content-Type: application/json" -H "Idempotency-Key: pos:R001" \\\n  -d '{"type":"purchase","customer_ref":"0901234567","order_id":"R001","source_type":"pos","amount_minor":2500}'`,
      status: '201 Created (200 if replayed)', res: { type: 'purchase', customer_ref: '0901234567', replayed: false, balance: 25, points_delta: 25, spins_earned: 0, tickets_earned: 0, detail: '…' } },
    { id: 'post-sales', m: 'POST', path: '/sales', title: 'Add points for a receipt',
      desc: 'Record a receipt and add points under the active rule. Each receipt is credited once. If the store joined a spin campaign, a qualifying receipt earns spins (<code>entitlements</code>) and lucky-draw tickets for open draws (<code>tickets</code>).',
      params: [['idempotency_key', 'string', true, 'De-duplication key, e.g. <code>pos:R001</code>. Re-sending it returns the earlier result (<code>replayed: true</code>).'],
        ['customer_ref', 'string', true, 'Phone number or customer code. The customer is created if missing.'],
        ['source_ref', 'string', true, 'Receipt number. Credited only once.'],
        ['amount_minor', 'integer', true, 'Receipt total in the smallest unit (positive integer): cents for USD, đồng for VND.'],
        ['source_type', 'string', false, 'Source, default <code>manual</code>. A POS should send <code>pos</code>.'],
        ['customer', 'object', false, '<code>{ name, phone }</code> — profile used when creating the customer.'],
        ['metadata', 'object', false, 'Any data to store with the transaction.']],
      curl: `curl -X POST {{BASE}}/sales ${KEY} \\\n  -H "Content-Type: application/json" \\\n  -d '{"idempotency_key":"pos:R001","customer_ref":"0901234567","source_type":"pos","source_ref":"R001","amount_minor":2500,"customer":{"name":"An","phone":"0901234567"}}'`,
      status: '201 Created (200 if replayed)', res: { entry: entry(), replayed: false, entitlements: [], tickets: [] } },
    { id: 'post-redemptions', m: 'POST', path: '/redemptions', title: 'Redeem points',
      desc: 'Deduct points when a customer redeems at the counter. The balance is checked — even if two terminals redeem at once, it never goes negative.',
      params: [['idempotency_key', 'string', true, 'De-duplication key, e.g. <code>redeem:G001</code>.'],
        ['customer_ref', 'string', true, 'Phone number or customer code (must exist).'],
        ['source_ref', 'string', true, 'Redemption code, usable once.'],
        ['points', 'integer', true, 'Points to deduct (positive integer).'],
        ['note', 'string', false, 'Note, max 500 characters.']],
      curl: `curl -X POST {{BASE}}/redemptions ${KEY} \\\n  -H "Content-Type: application/json" \\\n  -d '{"idempotency_key":"redeem:G001","customer_ref":"0901234567","source_ref":"G001","points":5,"note":"One free drink"}'`,
      status: '201 Created (200 if replayed)', res: { entry: entry({ transaction_type: 'redeem', points_delta: -5, amount_minor: 0, source_type: 'redemption', source_ref: 'G001', idempotency_key: 'redeem:G001' }), replayed: false, balance: 20 } },
    { id: 'get-account', m: 'GET', path: '/account', title: "A customer's points & history",
      desc: 'Returns the balance and transaction history (oldest → newest). 404 if the customer has no activity yet.',
      params: [['customer_ref', 'string', true, CUSTOMER_Q], ['page', 'integer', false, 'Page, default 1.'], ['per_page', 'integer', false, 'Rows per page, default 100, max 500.']],
      curl: `curl "{{BASE}}/account?customer_ref=0901234567" ${KEY}`,
      status: '200 OK', res: { customer: { id: 'b082973a-…', customer_ref: '0901234567', name: 'An', status: 'active' }, balance: 20, entries: [entry()], pagination: { page: 1, per_page: 100, total_items: 1 } } },
    { id: 'get-program', m: 'GET', path: '/program', title: 'Current points rule',
      desc: 'Returns the active rule, or <code>program: null</code> if none is configured.', params: [],
      curl: `curl {{BASE}}/program ${KEY}`, status: '200 OK',
      res: { program: { id: '5864eb28-…', version: 1, currency: 'USD', spend_per_point_minor: 100, points_per_step: 1, status: 'active' } } },
    { id: 'put-program', m: 'PUT', path: '/program', title: 'Set the points rule',
      desc: 'Creates and activates a new rule version. Past receipts keep their points.',
      params: [['spend_per_point_minor', 'integer', true, 'Spend (smallest unit) that earns one step of points.'], ['points_per_step', 'integer', false, 'Points per step, default 1.'], ['currency', 'string', false, '<code>USD</code> or <code>VND</code>. Default <code>VND</code> for backward compatibility — send it explicitly.']],
      curl: `curl -X PUT {{BASE}}/program ${KEY} \\\n  -H "Content-Type: application/json" \\\n  -d '{"currency":"USD","spend_per_point_minor":100,"points_per_step":1}'`,
      status: '200 OK', res: { id: '5864eb28-…', version: 2, currency: 'USD', spend_per_point_minor: 100, points_per_step: 1, status: 'active' } },
    { id: 'get-stats', m: 'GET', path: '/stats', title: 'Overview statistics',
      desc: 'Dashboard numbers: customers, points issued/redeemed, 30-day sales (store currency), spins, the last 15 days and the 8 latest transactions.', params: [],
      curl: `curl {{BASE}}/stats ${KEY}`, status: '200 OK',
      res: { customers: 128, points_issued: 5400, points_redeemed: 1200, sales_30d: 540000, receipts_today: 7, spins_available: 3, spins_used: 41, prizes_pending: 2, today: '2026-10-08', daily: [{ day: '2026-10-08', amount: 12500, points: 125, receipts: 7 }], recent: ['…'] } },
  ]},
  { id: 'rewards', title: 'Reward spins', endpoints: [
    { id: 'get-campaigns', m: 'GET', path: '/reward-world/campaigns', title: 'List open campaigns',
      desc: "Running shared spin campaigns in your store's currency, with prizes and whether the store has <code>joined</code>.", params: [],
      curl: `curl {{BASE}}/reward-world/campaigns ${KEY}`, status: '200 OK',
      res: { campaigns: [{ id: 'c1…', name: 'Lucky New Year', status: 'active', starts_at: '2026-10-01T00:00:00Z', ends_at: '2026-12-31T00:00:00Z', currency: 'USD', spend_per_spin_minor: 1000, max_spins_per_sale: 2, joined: true, prizes: [{ id: 'p1…', name: '$5 voucher', prize_type: 'voucher', weight: 1, max_wins: 10, status: 'active' }] }] } },
    { id: 'post-join', m: 'POST', path: '/reward-world/campaigns/:id/join', title: 'Join a campaign',
      desc: 'From then on, qualifying receipts (one spin per <code>spend_per_spin_minor</code>, up to <code>max_spins_per_sale</code>) earn spins. A campaign in another currency returns 409.', params: [],
      curl: `curl -X POST {{BASE}}/reward-world/campaigns/CAMPAIGN_ID/join ${KEY}`, status: '200 OK',
      res: { join: { id: 'j1…', campaign_id: 'c1…', status: 'active', joined_at: '2026-10-08T07:00:00Z' }, replayed: false } },
    { id: 'get-entitlements', m: 'GET', path: '/reward-world/entitlements', title: "A customer's remaining spins",
      desc: 'Unused spins, total and per campaign.',
      params: [['customer_ref', 'string', true, CUSTOMER_Q]],
      curl: `curl "{{BASE}}/reward-world/entitlements?customer_ref=0901234567" ${KEY}`, status: '200 OK',
      res: { available: 2, campaigns: [{ campaign_id: 'c1…', available: 2 }] } },
    { id: 'post-spins', m: 'POST', path: '/reward-world/spins', title: 'Spin for a customer',
      desc: 'Uses one spin. <b>The server decides the result</b> (weighted random, respecting win limits) before returning it — the client only displays it. A spin can be presented as <code>wheel</code>, <code>cards</code>, <code>dice</code> or <code>slot</code>; odds and prizes are identical.',
      params: [['campaign_id', 'string', true, 'Campaign to play.'], ['customer_ref', 'string', true, 'Player.'], ['idempotency_key', 'string', true, 'Re-sending the same key returns the same result without using another spin.'], ['game', 'string', false, '<code>wheel</code> (default) · <code>cards</code> · <code>dice</code> · <code>slot</code>. Stored with the result.']],
      curl: `curl -X POST {{BASE}}/reward-world/spins ${KEY} \\\n  -H "Content-Type: application/json" \\\n  -d '{"campaign_id":"CAMPAIGN_ID","customer_ref":"0901234567","idempotency_key":"spin:0901234567:1","game":"cards"}'`,
      status: '201 Created (200 if replayed)', res: { result: { id: 'r1…', prize_id: 'p1…', prize_name: '$5 voucher', prize_type: 'voucher', status: 'won', game: 'cards', spun_at: '2026-10-08T07:20:00Z' }, replayed: false } },
    { id: 'get-rewards', m: 'GET', path: '/reward-world/rewards', title: "A customer's prizes",
      desc: 'Prizes the customer won; <code>claim</code> is <code>null</code> until handed over.',
      params: [['customer_ref', 'string', true, CUSTOMER_Q]],
      curl: `curl "{{BASE}}/reward-world/rewards?customer_ref=0901234567" ${KEY}`, status: '200 OK',
      res: { rewards: [{ id: 'r1…', prize_name: '$5 voucher', status: 'won', spun_at: '2026-10-08T07:20:00Z', claim: null }] } },
    { id: 'post-claim', m: 'POST', path: '/reward-world/results/:id/claim', title: 'Mark a prize delivered',
      desc: 'Records that the store handed over the prize. Safe to repeat (<code>replayed: true</code>).',
      params: [['claim_note', 'string', false, 'Note, max 500 characters.']],
      curl: `curl -X POST {{BASE}}/reward-world/results/RESULT_ID/claim ${KEY} \\\n  -H "Content-Type: application/json" \\\n  -d '{"claim_note":"Handed over at counter 1"}'`,
      status: '201 Created (200 if replayed)', res: { claim: { id: 'cl1…', result_id: 'r1…', prize_name: '$5 voucher', claimed_at: '2026-10-08T07:25:00Z' }, replayed: false } },
  ]},
  { id: 'games', title: 'Retention games', endpoints: [
    { id: 'post-checkin', m: 'POST', path: '/games/checkin', title: 'Check in today',
      desc: 'Checks a customer in and adds points, once per day (<b>days follow Vietnam time</b>); repeating returns <code>replayed: true</code>. Consecutive days form a streak; each milestone (e.g. 7/14/30 days) pays once.',
      params: [['customer_ref', 'string', true, CUSTOMER_B]],
      curl: `curl -X POST {{BASE}}/games/checkin ${KEY} \\\n  -H "Content-Type: application/json" \\\n  -d '{"customer_ref":"0901234567"}'`,
      status: '201 Created (200 if already checked in)', res: { replayed: false, day: '2026-10-08', points: 10, streak: 7, milestone: { days: 7, points: 50 }, next_milestone: { days: 14, points: 120, remaining: 7 }, balance: 305 } },
    { id: 'get-checkin', m: 'GET', path: '/games/checkin', title: "A customer's streak",
      desc: '<code>streak</code> is the current streak (still alive if checked in today or yesterday). <code>recent_days</code> lists recent check-ins.',
      params: [['customer_ref', 'string', true, CUSTOMER_Q]],
      curl: `curl "{{BASE}}/games/checkin?customer_ref=0901234567" ${KEY}`, status: '200 OK',
      res: { customer_ref: '0901234567', today: '2026-10-08', checked_in_today: true, streak: 7, total_checkins: 23, last_checkin: '2026-10-08', recent_days: ['2026-10-08', '2026-10-07'], checkin_points: 10, next_milestone: { days: 14, points: 120, remaining: 7 }, milestones: [{ days: 7, points: 50 }, { days: 14, points: 120 }] } },
    { id: 'get-missions', m: 'GET', path: '/games/missions', title: "A customer's missions today",
      desc: "Active missions with today's progress. <code>kind</code>: <code>checkin</code>, <code>receipts</code> (receipts today), <code>spend</code> (today's spend, smallest unit). Without <code>customer_ref</code> it returns the mission definitions.",
      params: [['customer_ref', 'string', true, CUSTOMER_Q]],
      curl: `curl "{{BASE}}/games/missions?customer_ref=0901234567" ${KEY}`, status: '200 OK',
      res: { customer_ref: '0901234567', day: '2026-10-08', missions: [{ id: 'm1…', name: 'Buy once', kind: 'receipts', target: 1, reward_type: 'points', reward_points: 20, current: 1, completed: true, claimed: false }] } },
    { id: 'post-mission-claim', m: 'POST', path: '/games/missions/:id/claim', title: 'Claim a mission reward',
      desc: 'Pays out a completed mission: points, or a <b>spin</b> (used with <code>/reward-world/spins</code>). Once per day. Not completed → 409.',
      params: [['customer_ref', 'string', true, CUSTOMER_B]],
      curl: `curl -X POST {{BASE}}/games/missions/MISSION_ID/claim ${KEY} \\\n  -H "Content-Type: application/json" \\\n  -d '{"customer_ref":"0901234567"}'`,
      status: '201 Created (200 if already claimed)', res: { replayed: false, mission_id: 'm1…', day: '2026-10-08', reward: { type: 'points', points: 20 }, balance: 325 } },
    { id: 'get-draws', m: 'GET', path: '/games/draws', title: 'List lucky draws',
      desc: "The store's draws. While a draw is <code>open</code>, each receipt earns tickets (<code>tickets</code> in the response) per <code>spend_per_ticket_minor</code> and <code>max_tickets_per_sale</code>.", params: [],
      curl: `curl {{BASE}}/games/draws ${KEY}`, status: '200 OK',
      res: { draws: [{ id: 'd1…', name: 'October draw', status: 'open', spend_per_ticket_minor: 1000, max_tickets_per_sale: 3, one_prize_per_customer: true, prizes: [{ name: '1st prize', quantity: 1 }], ticket_count: 48, customer_count: 21, winner_count: 0 }] } },
    { id: 'post-draw-tickets', m: 'POST', path: '/games/draws/:id/tickets', title: 'Issue tickets manually',
      desc: 'Adds up to 50 tickets at a time while the draw is <code>draft</code> or <code>open</code>. Ticket numbers are sequential per draw. The same <code>idempotency_key</code> never issues twice.',
      params: [['customer_ref', 'string', true, 'Phone number or customer code.'], ['count', 'integer', false, 'Tickets, default 1.'], ['idempotency_key', 'string', false, 'De-duplication key.']],
      curl: `curl -X POST {{BASE}}/games/draws/DRAW_ID/tickets ${KEY} \\\n  -H "Content-Type: application/json" \\\n  -d '{"customer_ref":"0901234567","count":2,"idempotency_key":"promo:abc"}'`,
      status: '201 Created', res: { tickets: [{ id: 't1…', draw_id: 'd1…', ticket_no: 49, customer_ref: '0901234567' }, { id: 't2…', draw_id: 'd1…', ticket_no: 50, customer_ref: '0901234567' }] } },
    { id: 'post-draw-run', m: 'POST', path: '/games/draws/:id/draw', title: 'Run the draw',
      desc: 'Picks winners at random (secure source) and closes the draw. Each draw runs <b>once</b>; with “one prize per customer” nobody wins twice. Prizes listed first are drawn first.', params: [],
      curl: `curl -X POST {{BASE}}/games/draws/DRAW_ID/draw ${KEY}`, status: '201 Created',
      res: { draw_id: 'd1…', tickets: 48, winners: [{ id: 'w1…', ticket_no: 5, customer_ref: '0977333444', prize_name: '1st prize', prize_index: 0, status: 'won' }] } },
    { id: 'get-challenges', m: 'GET', path: '/games/challenges', title: "A customer's weekly challenges",
      desc: 'Like daily missions but per <b>week (Monday – Sunday, Vietnam time)</b>. For <code>checkin</code> the target is <i>days checked in this week</i> (1–7); <code>receipts</code> and <code>spend</code> accumulate over the week.',
      params: [['customer_ref', 'string', true, CUSTOMER_Q]],
      curl: `curl "{{BASE}}/games/challenges?customer_ref=0901234567" ${KEY}`, status: '200 OK',
      res: { customer_ref: '0901234567', period: 'week', period_start: '2026-10-05', period_end: '2026-10-11', missions: [{ id: 'w1…', name: 'Check in 5 days', kind: 'checkin', target: 5, reward_type: 'points', reward_points: 60, current: 5, completed: true, claimed: false }] } },
    { id: 'post-challenge-claim', m: 'POST', path: '/games/challenges/:id/claim', title: 'Claim a weekly reward',
      desc: 'Once per week. <code>reward.type</code> is <code>points</code>, <code>spin</code> or <code>gift</code> (a gift ticket waits for staff, see <code>/games/gifts</code>). Not reached → 409.',
      params: [['customer_ref', 'string', true, CUSTOMER_B]],
      curl: `curl -X POST {{BASE}}/games/challenges/CHALLENGE_ID/claim ${KEY} \\\n  -H "Content-Type: application/json" \\\n  -d '{"customer_ref":"0901234567"}'`,
      status: '201 Created (200 if already claimed)', res: { replayed: false, mission_id: 'w2…', period: 'week', day: '2026-10-05', reward: { type: 'gift', label: 'Tote bag', gift_id: 'g1…' }, balance: 325 } },
    { id: 'post-treasure-redeem', m: 'POST', path: '/games/treasure/redeem', title: 'Redeem a treasure code',
      desc: 'The customer enters a hidden reward code. Codes ignore case, spaces and hyphens (<code>k7m2-xp9q</code> = <code>K7M2XP9Q</code>). Once per customer per treasure; fully claimed treasures return 409. Create treasures in the dashboard or with <code>POST /games/treasures</code>.',
      params: [['customer_ref', 'string', true, 'Phone number or customer code.'], ['code', 'string', true, 'Code the customer typed.']],
      curl: `curl -X POST {{BASE}}/games/treasure/redeem ${KEY} \\\n  -H "Content-Type: application/json" \\\n  -d '{"customer_ref":"0901234567","code":"k7m2-xp9q"}'`,
      status: '201 Created (200 if claimed before)', res: { replayed: false, treasure: { id: 't1…', name: 'About-page treasure', hint: 'Scroll to the bottom' }, reward: { type: 'points', points: 30 }, balance: 355 } },

const ERRORS = [
  ['400', 'Missing or invalid input', '<code>amount_minor must be a positive integer.</code>'],
  ['401', 'Missing, invalid or revoked API key', '<code>API key is invalid or revoked.</code>'],
  ['403', 'Not allowed (e.g. managing keys with an API key)', '<code>API keys can only be managed from a signed-in session.</code>'],
  ['404', 'Not found', '<code>Customer was not found.</code> · <code>No active loyalty program is configured for this tenant.</code>'],
  ['409', 'Business conflict', '<code>This receipt/source was already credited.</code> · <code>Insufficient points. Current balance is 3.</code> · <code>Customer has no available spin.</code> · <code>Sale amount is below the minimum spend required to earn points.</code>'],
  ['500', 'Server error — retry with the same <code>idempotency_key</code>', '<code>Internal server error.</code>'],
];

const FLOW = {
  curl: `# 1) Customer gives a phone number → show points
curl "{{BASE}}/account?customer_ref=0901234567" ${KEY}

# 2) Checkout → add points (safe to repeat)
curl -X POST {{BASE}}/sales ${KEY} -H "Content-Type: application/json" \\
  -d '{"idempotency_key":"pos:R001","customer_ref":"0901234567","source_type":"pos","source_ref":"R001","amount_minor":2500}'

# 3) Customer redeems 5 points
curl -X POST {{BASE}}/redemptions ${KEY} -H "Content-Type: application/json" \\
  -d '{"idempotency_key":"redeem:G001","customer_ref":"0901234567","source_ref":"G001","points":5}'`,
  js: `const API = "{{BASE}}";
const KEY = "lsk_YOUR_KEY";

async function call(path, body) {
  const res = await fetch(API + path, {
    method: body ? "POST" : "GET",
    headers: { Authorization: \`Bearer \${KEY}\`, "Content-Type": "application/json" },
    body: body && JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error);   // { error: "..." }
  return data;
}

// Checkout: add points. Network error? Just call again, nothing is counted twice.
const sale = await call("/sales", {
  idempotency_key: "pos:R001", customer_ref: "0901234567",
  source_type: "pos", source_ref: "R001", amount_minor: 2500,
});
console.log("Added", sale.entry.points_delta, "points; new spins:", sale.entitlements?.length ?? 0);

// Redeem
const redeem = await call("/redemptions", {
  idempotency_key: "redeem:G001", customer_ref: "0901234567", source_ref: "G001", points: 5,
});
console.log("Balance", redeem.balance);`,
  py: `import requests

API = "{{BASE}}"
HEADERS = {"Authorization": "Bearer lsk_YOUR_KEY"}

def call(path, body=None):
    r = requests.request("POST" if body else "GET", API + path, headers=HEADERS, json=body, timeout=10)
    data = r.json()
    if not r.ok:
        raise RuntimeError(data["error"])
    return data

sale = call("/sales", {
    "idempotency_key": "pos:R001", "customer_ref": "0901234567",
    "source_type": "pos", "source_ref": "R001", "amount_minor": 2500,
})
print("Added", sale["entry"]["points_delta"], "points")

redeem = call("/redemptions", {
    "idempotency_key": "redeem:G001", "customer_ref": "0901234567", "source_ref": "G001", "points": 5,
})
print("Balance", redeem["balance"])`,
  php: `<?php
$api = "{{BASE}}"; $key = "lsk_YOUR_KEY";

function call($path, $body = null) {
    global $api, $key;
    $ch = curl_init($api . $path);
    curl_setopt_array($ch, [
        CURLOPT_RETURNTRANSFER => true, CURLOPT_TIMEOUT => 10,
        CURLOPT_HTTPHEADER => ["Authorization: Bearer $key", "Content-Type: application/json"],
    ]);
    if ($body) { curl_setopt($ch, CURLOPT_POST, true); curl_setopt($ch, CURLOPT_POSTFIELDS, json_encode($body)); }
    $data = json_decode(curl_exec($ch), true);
    if (curl_getinfo($ch, CURLINFO_HTTP_CODE) >= 400) throw new Exception($data["error"]);
    return $data;
}

$sale = call("/sales", [
    "idempotency_key" => "pos:R001", "customer_ref" => "0901234567",
    "source_type" => "pos", "source_ref" => "R001", "amount_minor" => 2500,
]);
echo "Added " . $sale["entry"]["points_delta"] . " points";`,
};

const sections = [];
sections.push(`<section class="doc-section" id="intro">

sections.push(`<section class="doc-section" id="auth"><h2>Authentication</h2>
  <p>Create an API key under <a href="integrations.html">POS integration</a> in the dashboard and send it with every request:</p>
  ${code('Authorization: Bearer lsk_YOUR_KEY')}
  <div class="callout mt-3"><b>Each key belongs to one store</b> and only reaches that store's data. It is shown once — store it safely and <b>never embed it in client apps</b> (web or mobile); call from your server or POS. Leaked? Revoke it and create a new one.</div>
</section>`);
sections.push(`<section class="doc-section" id="idempotency"><h2>Idempotency</h2>
  <p>Write requests (<code>/sales</code>, <code>/redemptions</code>, <code>/reward-world/spins</code>) require an <code>idempotency_key</code>. If the network fails or you are unsure a request succeeded, <b>send it again unchanged</b>: you get the earlier result with <code>replayed: true</code> and nothing is counted twice.</p>
  <ul><li>Use stable business keys: <code>pos:&lt;receipt&gt;</code>, <code>redeem:&lt;code&gt;</code>.</li>
  <li>Re-using a key for a <b>different request</b> returns 409.</li>
  <li>A receipt number (<code>source_ref</code>) is also credited only once, even with different keys.</li></ul>
</section>`);
sections.push(`<section class="doc-section" id="conventions"><h2>Conventions</h2>
  <ul><li>Each store uses <b>USD or VND</b> (set in its points rule). Amounts are <b>integers in the smallest unit</b> (<code>amount_minor</code>): <code>2500</code> = $25.00 in USD, or 2,500 ₫ in VND. Points are integers too.</li>
  <li>Timestamps are ISO 8601 (UTC). Numbers are returned as <b>numbers</b>, not strings.</li>
  <li><code>customer_ref</code> is a phone number or any customer code you choose — be consistent.</li>
  <li>Game points (check-in, streaks, missions) go into the <b>same ledger</b> as receipts, so <code>balance</code> is always the total.</li>
  <li>Errors look like <code>{ "error": "message" }</code> with a matching HTTP status.</li></ul>
</section>`);

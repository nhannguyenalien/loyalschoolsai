<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overview - Loyal SchoolsAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
</head>
<body class="layout-fluid">
<div class="page" id="layout"></div>
<template id="tpl">
  <div class="row row-cards mb-1" id="stats"></div>
  <div class="row row-cards">
    <div class="col-lg-8">
      <section class="card mb-3">
        <div class="card-header"><h3 class="card-title" data-vi="Hoạt động 14 ngày qua">Last 14 days</h3>
          <div class="card-actions btn-group btn-group-sm" id="metric-toggle"><button class="btn active" data-metric="amount" data-vi="Doanh số">Sales</button><button class="btn" data-metric="points" data-vi="Điểm">Points</button><button class="btn" data-metric="receipts" data-vi="Hóa đơn">Receipts</button></div></div>
        <div class="card-body"><div class="chart" id="chart"></div></div>
      </section>
      <section class="card">
        <div class="card-header"><h3 class="card-title" data-vi="Giao dịch gần đây">Recent activity</h3><a class="ms-auto small" href="customers.html" data-vi="Tra cứu khách →">Look up customers →</a></div>
        <div class="card-body py-2" id="recent"></div>
      </section>
    </div>
    <div class="col-lg-4">
      <section class="card mb-3">
        <div class="card-header"><h3 class="card-title" data-vi="Bắt đầu nhanh">Getting started</h3></div>
        <div class="card-body py-2" id="steps"><div class="text-secondary py-3" data-vi="Đang kiểm tra...">Checking...</div></div>
      </section>
      <section class="card">
        <div class="card-body">
          <div class="fw-bold mb-2" data-vi="Lối tắt">Shortcuts</div>
          <div class="d-grid gap-2">
            <a class="btn btn-grad" href="customers.html"><i class="ti ti-plus me-1"></i><span data-vi="Cộng điểm cho khách">Add points</span></a>
            <a class="btn btn-outline-primary" href="rewards.html"><i class="ti ti-gift me-1"></i><span data-vi="Mở vòng quay">Open reward spins</span></a>
            <a class="btn btn-outline-secondary" href="docs.html" target="_blank"><i class="ti ti-book-2 me-1"></i><span data-vi="Tài liệu API">API docs</span></a>
          </div>
        </div>
      </section>
    </div>
  </div>
</template>
<script>
(async () => {
  await requireAuth();
  const firstName = window.AUTH_USER?.name ? ', ' + window.AUTH_USER.name.split(' ').slice(-1)[0] : '';
  renderLayout('overview', T(`Hello${firstName} 👋`, `Xin chào${firstName} 👋`), T("How your store's loyalty program is doing.", 'Tình hình chương trình khách hàng thân thiết của cửa hàng.'));
  document.getElementById('content').append(document.getElementById('tpl').content.cloneNode(true));
  applyI18n(); applyCurrency();
  const $ = id => document.getElementById(id);
  let stats, metric = 'amount';

  const card = (icon, tone, label, value, sub = '') => `<div class="col-6 col-md-4 col-xl-2"><div class="card stat"><div class="card-body"><div class="stat-icon tone-${tone}"><i class="ti ${icon}"></i></div><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${sub ? `<div class="small text-secondary mt-1">${sub}</div>` : ''}</div></div></div>`;
  const compactNumber = new Intl.NumberFormat(LOCALE, { notation: 'compact', maximumFractionDigits: 1 });
  const compact = v => compactNumber.format(v);
  // Large totals are abbreviated; the full amount is in the tooltip.
  const shortMoney = minor => toMajor(minor) >= 1e6 ? `${currencySymbol() === '$' ? '$' : ''}${compactNumber.format(toMajor(minor))}${currencySymbol() === '$' ? '' : ' ₫'}` : fmtMoney(minor);

  function renderStats() {
    $('stats').innerHTML =
      card('ti-users', 'indigo', T('Customers', 'Khách hàng'), money.format(stats.customers)) +
      card('ti-coins', 'green', T('Points issued', 'Điểm đã phát'), money.format(stats.points_issued)) +
      card('ti-gift-card', 'amber', T('Points redeemed', 'Điểm đã dùng'), money.format(stats.points_redeemed)) +
      card('ti-receipt-2', 'blue', T('Sales, 30 days', 'Doanh số 30 ngày'), `<span title="${fmtMoney(stats.sales_30d)}">${shortMoney(stats.sales_30d)}</span>`, T(`${stats.receipts_today} ${plural(stats.receipts_today, 'receipt', 'receipts')} today`, `${stats.receipts_today} hóa đơn hôm nay`)) +
      card('ti-rotate-clockwise-2', 'violet', T('Spins waiting', 'Lượt quay chờ'), money.format(stats.spins_available), T(`${money.format(stats.spins_used)} used`, `${money.format(stats.spins_used)} lượt đã quay`)) +
      card('ti-trophy', 'pink', T('Prizes to hand out', 'Giải chờ giao'), money.format(stats.prizes_pending));
  }

  function renderChart() {
    const days = [], base = new Date(stats.today + 'T00:00:00');
    for (let i = 13; i >= 0; i--) { const d = new Date(base); d.setDate(d.getDate() - i); days.push(d.toISOString().slice(0, 10)); }
    const byDay = new Map(stats.daily.map(d => [d.day, d]));
    const raw = days.map(d => byDay.get(d)?.[metric] || 0);
    const values = metric === 'amount' ? raw.map(v => toMajor(v)) : raw;
    const max = Math.max(...values, 1);
    $('chart').innerHTML = days.map((d, i) => {
      const v = values[i], h = v ? Math.max(4, Math.round(v / max * 100)) : 0;
      return `<div class="col" title="${d}: ${metric === 'amount' ? fmtMoney(raw[i]) : money.format(v)}"><div class="val">${v ? (metric === 'amount' ? compact(v) : money.format(v)) : ''}</div><div class="bar ${d === stats.today ? 'today' : ''} ${v ? '' : 'zero'}" style="height:${v ? h * 1.2 : 3}px"></div><div class="lbl">${T(`${d.slice(5, 7)}/${d.slice(8)}`, `${d.slice(8)}/${d.slice(5, 7)}`)}</div></div>`;
    }).join('');
  }
  $('metric-toggle').addEventListener('click', e => {
    const b = e.target.closest('[data-metric]'); if (!b) return;
    metric = b.dataset.metric;
    $('metric-toggle').querySelectorAll('.btn').forEach(x => x.classList.toggle('active', x === b));
    renderChart();
  });

  function renderRecent() {
    $('recent').innerHTML = stats.recent.map(r => {
      const bonus = r.transaction_type === 'bonus', earn = r.transaction_type === 'earn' || bonus;
      return `<div class="activity"><span class="avatar avatar-sm ${bonus ? 'tone-violet' : earn ? 'tone-green' : 'tone-amber'} rounded-circle"><i class="ti ${bonus ? 'ti-sparkles' : earn ? 'ti-arrow-up-right' : 'ti-arrow-down-right'}"></i></span>
        <div class="me-auto" style="min-width:0"><div class="fw-bold text-truncate">${esc(r.name || r.customer_ref)} <span class="text-secondary fw-normal small">${esc(r.customer_ref)}</span></div><div class="small text-secondary">${bonus ? T('Game bonus', 'Thưởng game') : earn ? T('Receipt', 'Hóa đơn') : T('Redemption', 'Đổi thưởng')} ${bonus ? '' : esc(r.source_ref)} · ${esc(fmtShort(r.occurred_at))}</div></div>
        <div class="text-end"><div class="fw-bold ${earn ? 'text-success' : 'text-danger'}">${earn ? '+' : ''}${pts(r.points_delta)}</div>${earn ? `<div class="small text-secondary">${fmtMoney(r.amount_minor, r.currency)}</div>` : ''}</div></div>`;
    }).join('') || `<div class="empty-state"><i class="ti ti-receipt-off"></i>${T('No activity yet. Add points for your first receipt to get started.', 'Chưa có giao dịch nào. Cộng điểm hóa đơn đầu tiên để bắt đầu.')}</div>`;
  }

  async function renderSteps() {
    const [program, keys, world] = await Promise.all([LoyaltyAPI.getProgram(), LoyaltyAPI.listKeys(), LoyaltyAPI.campaigns()]);
    const steps = [
      [!!program.program, T('Set the points rule', 'Đặt luật tích điểm'), T('How much spend earns 1 point.', 'Chi bao nhiêu thì được 1 điểm.'), 'settings.html'],
      [keys.keys.length > 0, T('Create a POS API key', 'Tạo API key cho POS'), T('So your POS adds points at checkout.', 'Để POS tự cộng điểm khi chốt đơn.'), 'integrations.html'],
      [world.campaigns.some(c => c.joined), T('Join a spin campaign', 'Tham gia chương trình quay thưởng'), T('Qualifying receipts earn spins automatically.', 'Hóa đơn đủ điều kiện sẽ tự nhận lượt quay.'), 'rewards.html'],
      [stats.receipts_today > 0 || stats.points_issued > 0, T('Add your first receipt', 'Cộng điểm hóa đơn đầu tiên'), T('Try entering one manually.', 'Thử nhập một hóa đơn thủ công.'), 'customers.html'],
    ];
    $('steps').innerHTML = steps.map(([done, title, text, href], i) => `<a class="step text-reset text-decoration-none ${done ? 'done' : ''}" href="${href}"><span class="dot">${done ? '✓' : i + 1}</span><div><div class="fw-bold">${title}</div><div class="small text-secondary">${text}</div></div></a>`).join('');
  }

  try {
    await loadProgram();
    stats = await LoyaltyAPI.stats();
    // Cửa hàng mới tinh (chưa có luật, chưa có khách) → dẫn vào trang bắt đầu nhanh một lần.
    let skipped = false; try { skipped = !!localStorage.getItem('welcome_done'); } catch {}
    if (!skipped && !stats.customers && !stats.points_issued && !(await LoyaltyAPI.getProgram()).program) { location.replace('welcome.html'); return; }
    renderStats(); renderChart(); renderRecent();
    await renderSteps();
  } catch (e) { showAlert(e.message, 'danger'); }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trang khách & QR - Loyal SchoolsAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="assets/js/qr.js"></script>
  <style>
    #poster { display: none; }
    #poster .qr svg { width: 100%; height: auto; display: block; }
    @media print {
      body * { visibility: hidden; }
      #poster, #poster * { visibility: visible; }
      #poster { display: block; position: absolute; left: 0; top: 0; width: 100%; text-align: center; padding: 24mm 16mm; font-family: var(--tblr-font-sans-serif); }
      #poster h1 { font-size: 34pt; font-weight: 800; margin: 0 0 6mm; }
      #poster p { font-size: 16pt; margin: 0 0 10mm; }
      #poster .qr { width: 110mm; margin: 0 auto 8mm; }
      #poster .url { font-size: 12pt; color: #555; word-break: break-all; }
    }
  </style>
</head>
<body class="layout-fluid">
<div class="page" id="layout"></div>
<template id="tpl">
<div class="row row-cards">
  <div class="col-lg-5">
    <section class="card"><div class="card-body text-center">
      <div id="qr" class="mx-auto mb-3" style="max-width:280px"></div>
      <div class="input-group mb-3"><input id="link" class="form-control" readonly onclick="this.select()"><button class="btn" id="copy" type="button">Sao chép</button></div>
      <div class="btn-list justify-content-center">
        <a class="btn btn-outline-primary" id="open" target="_blank" rel="noopener"><i class="ti ti-external-link me-1"></i>Mở thử</a>
        <button class="btn btn-outline-primary" id="png" type="button"><i class="ti ti-download me-1"></i>Tải PNG</button>
        <button class="btn btn-grad" id="print" type="button"><i class="ti ti-printer me-1"></i>In poster</button>
      </div>
    </div></section>
  </div>
  <div class="col-lg-7">
    <section class="card mb-3"><div class="card-header"><h3 class="card-title"><i class="ti ti-smart-home me-2"></i>Trang cho khách của bạn</h3></div>
      <form class="card-body" id="page-form">
        <p class="text-secondary">Khách quét mã QR, nhập số điện thoại để xem điểm, điểm danh, nhận thưởng nhiệm vụ và quay thưởng — không cần cài app hay đăng nhập.</p>
        <div class="mb-3"><label class="form-label">Tên hiển thị cho khách</label><input id="name" class="form-control" maxlength="80" required></div>
        <div class="mb-3"><label class="form-label">Đường dẫn</label><div class="input-group"><span class="input-group-text" id="origin"></span><input id="slug" class="form-control" maxlength="30" pattern="[a-z0-9][a-z0-9\-]{2,29}" required></div><div class="form-hint">3–30 ký tự: chữ thường, số, dấu gạch ngang. Đổi đường dẫn thì mã QR cũ sẽ không dùng được nữa.</div></div>
        <label class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="enabled"><span class="form-check-label">Đang mở cho khách</span></label>
        <button class="btn btn-grad" type="submit"><i class="ti ti-device-floppy me-1"></i>Lưu</button>
      </form>
    </section>
    <section class="card"><div class="card-body small text-secondary">
      <div class="fw-bold text-body mb-1">Lưu ý</div>
      Khách chỉ xem được điểm khi số điện thoại đã có hồ sơ (sau lần mua đầu tiên). Trang không hiện họ tên đầy đủ hay lịch sử giao dịch. Quà hiện vật trúng thưởng vẫn do nhân viên trao tại quầy ở mục <a href="rewards.html">Quay thưởng</a> / <a href="missions.html">Nhiệm vụ</a>.
    </div></section>
  </div>
</div>
<div id="poster"><h1 id="poster-name"></h1><p>Quét mã – tích điểm – điểm danh – quay thưởng mỗi ngày!</p><div class="qr" id="poster-qr"></div><div class="url" id="poster-url"></div></div>
</template>
<script>
(async () => {
  await requireAuth();
  renderLayout('qr', 'Trang khách & QR', 'Cho khách tự xem điểm, điểm danh và quay thưởng bằng cách quét mã.');
  document.getElementById('content').append(document.getElementById('tpl').content.cloneNode(true));
  const $ = id => document.getElementById(id);
  let page = null;

  const publicUrl = () => `${location.origin}/c?s=${page.slug}`;

  function paint() {
    const url = publicUrl(), svg = qrSvg(url);
    $('qr').innerHTML = svg; $('poster-qr').innerHTML = svg;
    $('link').value = url; $('open').href = url; $('poster-url').textContent = url; $('poster-name').textContent = page.name;
    $('name').value = page.name; $('slug').value = page.slug; $('enabled').checked = page.enabled; $('origin').textContent = `${location.host}/c?s=`;
    $('qr').style.opacity = page.enabled ? 1 : .35;
  }

  $('copy').addEventListener('click', () => copyText($('link').value, $('copy')));
  $('print').addEventListener('click', () => window.print());
  $('png').addEventListener('click', () => downloadQrPng(publicUrl(), `qr-${page.slug}.png`));
  onSubmit('page-form', async () => {
    ({ page } = await LoyaltyAPI.saveStorePage({ name: $('name').value.trim(), slug: $('slug').value.trim().toLowerCase(), enabled: $('enabled').checked }));
    paint(); showAlert('Đã lưu.');
  });

  try { ({ page } = await LoyaltyAPI.storePage()); paint(); }
  catch (e) { showAlert(e.message, 'danger'); }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
</body>
</html>

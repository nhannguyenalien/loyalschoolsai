<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luật tích điểm - Loyal SchoolsAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
</head>
<body class="layout-fluid">
<div class="page" id="layout"></div>
<template id="tpl">
<div class="row row-cards">
  <div class="col-lg-6">
    <section class="card">
      <div class="card-header"><h3 class="card-title">Quy đổi điểm</h3></div>
      <form class="card-body" id="program-form">
        <div class="mb-3"><label class="form-label">Khách chi tiêu bao nhiêu (VND)</label><input id="spend-per-point" class="form-control form-control-lg" type="number" min="1" step="1" value="10000" required></div>
        <div class="mb-4"><label class="form-label">Thì nhận số điểm</label><input id="points-per-step" class="form-control form-control-lg" type="number" min="1" step="1" value="1" required></div>
        <button class="btn btn-grad" type="submit"><i class="ti ti-device-floppy me-1"></i>Lưu và kích hoạt</button>
        <div class="form-hint mt-3" id="program-status">Đang tải luật hiện tại...</div>
      </form>
    </section>
  </div>
  <div class="col-lg-6">
    <section class="card mb-3">
      <div class="card-header"><h3 class="card-title">Xem trước</h3></div>
      <div class="card-body"><div id="preview"></div></div>
    </section>
    <section class="card"><div class="card-body">
      <div class="fw-bold mb-1"><i class="ti ti-info-circle me-1 text-primary"></i>Cách hoạt động</div>
      <ul class="text-secondary mb-0 ps-3">
        <li>Điểm = phần nguyên của (số tiền ÷ mức chi) × số điểm.</li>
        <li>Mỗi lần lưu tạo một <b>phiên bản</b> mới; giao dịch cũ giữ nguyên điểm đã tính.</li>
        <li>Hóa đơn nhỏ hơn mức chi tối thiểu sẽ không được cộng điểm.</li>
      </ul>
    </div></section>
  </div>
</div>
</template>
<script>
(async () => {
  await requireAuth();
  renderLayout('settings', 'Luật tích điểm', 'Khách chi bao nhiêu thì được bao nhiêu điểm.');
  document.getElementById('content').append(document.getElementById('tpl').content.cloneNode(true));
  const $ = id => document.getElementById(id);

  function preview() {
    const spend = Number($('spend-per-point').value) || 0, step = Number($('points-per-step').value) || 0;
    if (!spend || !step) { $('preview').innerHTML = ''; return; }
    const rows = [spend / 2, spend, spend * 5, spend * 25].map(a => Math.round(a)).map(a => [a, Math.floor(a / spend) * step]);
    $('preview').innerHTML = `<table class="table table-vcenter mb-0"><thead><tr><th>Hóa đơn</th><th class="text-end">Điểm nhận</th></tr></thead><tbody>${rows.map(([a, p]) => `<tr><td>${money.format(a)} ₫</td><td class="text-end">${p ? `<span class="pill pill-earn">+${money.format(p)}</span>` : '<span class="text-secondary">không đủ mức</span>'}</td></tr>`).join('')}</tbody></table>`;
  }
  ['spend-per-point', 'points-per-step'].forEach(id => $(id).addEventListener('input', preview));

  function renderProgram(p) {
    if (!p) { $('program-status').textContent = 'Chưa có luật đang hoạt động. Lưu form để tạo luật đầu tiên.'; preview(); return; }
    $('spend-per-point').value = p.spend_per_point_minor;
    $('points-per-step').value = p.points_per_step;
    $('program-status').innerHTML = `Đang dùng <b>phiên bản ${p.version}</b>: mỗi ${money.format(Number(p.spend_per_point_minor))} ₫ nhận ${p.points_per_step} điểm.`;
    preview();
  }
  onSubmit('program-form', async () => {
    const program = await LoyaltyAPI.saveProgram({ currency: 'VND', spend_per_point_minor: Number($('spend-per-point').value), points_per_step: Number($('points-per-step').value) });
    showAlert(`Đã kích hoạt luật phiên bản ${program.version}.`);
    renderProgram(program);
  });
  try { renderProgram((await LoyaltyAPI.getProgram()).program); }
  catch (e) { showAlert(e.message, 'danger'); $('program-status').textContent = 'Không tải được luật hiện tại.'; }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
</body>
</html>

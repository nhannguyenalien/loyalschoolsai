<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập - Loyal SchoolsAI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
</head>
<body class="d-flex flex-column">
<div class="page page-center"><div class="container container-tight py-4">
  <div class="text-center mb-4"><h1>Loyal SchoolsAI</h1><div class="text-secondary">Tích điểm, chăm sóc khách hàng & quà tặng</div></div>
  <form class="card card-md" id="login-form"><div class="card-body">
    <h2 class="card-title text-center mb-4" id="form-title">Đăng nhập</h2>
    <div id="alert"></div>
    <div class="mb-3"><label class="form-label">Email</label><input id="email" type="email" class="form-control" autocomplete="username" required></div>
    <div class="mb-3"><label class="form-label">Mật khẩu <a href="#" id="forgot" class="float-end small">Quên mật khẩu?</a></label><input id="password" type="password" class="form-control" autocomplete="current-password" minlength="6" required></div>
    <button class="btn btn-primary w-100" type="submit" id="submit-btn">Đăng nhập</button>
    <div class="hr-text">hoặc</div>
    <button class="btn w-100" type="button" id="google-btn"><img src="https://www.svgrepo.com/show/475656/google-color.svg" width="18" height="18" class="me-2" alt="">Tiếp tục với Google</button>
    <div class="text-center text-secondary mt-3"><span id="switch-text">Chưa có tài khoản?</span> <a href="#" id="switch-mode">Đăng ký</a></div>
  </div></form>
</div></div>
<script>
  let mode = 'login';
  const $ = id => document.getElementById(id);
  const value = id => $(id).value.trim();

  $('switch-mode').addEventListener('click', event => {
    event.preventDefault();
    mode = mode === 'login' ? 'register' : 'login';
    const register = mode === 'register';
    $('form-title').textContent = register ? 'Tạo tài khoản' : 'Đăng nhập';
    $('submit-btn').textContent = register ? 'Đăng ký' : 'Đăng nhập';
    $('switch-text').textContent = register ? 'Đã có tài khoản?' : 'Chưa có tài khoản?';
    $('switch-mode').textContent = register ? 'Đăng nhập' : 'Đăng ký';
    $('forgot').classList.toggle('d-none', register);
    $('password').autocomplete = register ? 'new-password' : 'current-password';
  });
  $('forgot').addEventListener('click', async event => {
    event.preventDefault();
    try {
      if (!value('email')) throw new Error('Nhập email trước, rồi bấm "Quên mật khẩu".');
      await resetPassword(value('email'));
      showAlert('Đã gửi email đặt lại mật khẩu (nếu email có tài khoản).');
    } catch (error) { showAlert(error.message, 'danger'); }
  });
  onSubmit('login-form', () => (mode === 'login' ? loginWithPassword : registerWithPassword)(value('email'), $('password').value));
  $('google-btn').addEventListener('click', async event => {
    event.currentTarget.disabled = true;
    try { await loginWithGoogle(); }
    catch (error) { showAlert(error.message, 'danger'); event.currentTarget.disabled = false; }
  });
  authReady.then(user => { if (user) location.href = 'customers.html'; });
</script>
</body>
</html>

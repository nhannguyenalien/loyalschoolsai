<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reward spins - Loyal SchoolsAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/wheel.js"></script>
  <script src="assets/js/confetti.js"></script>
  <script src="assets/js/minigames.js"></script>
</head>
<body class="layout-fluid">
<div class="page" id="layout"></div>
<template id="tpl">
<section class="card mb-4">
  <div class="card-body">
    <div class="row g-3 align-items-center">
      <div class="col-lg-5">
        <div class="fw-bold mb-1" data-vi="Khách sắp quay">Customer to spin</div>
        <form id="customer-form" class="input-group"><input id="customer-ref" class="form-control form-control-lg" placeholder="Phone number / customer code" data-vi-placeholder="Số điện thoại / mã khách" required inputmode="tel"><button class="btn btn-primary" type="submit"><i class="ti ti-search me-1"></i><span data-vi="Kiểm tra">Check</span></button></form>
      </div>
      <div class="col-lg-7" id="customer-status"><div class="text-secondary"><i class="ti ti-info-circle me-1"></i><span data-vi="Nhập số điện thoại để xem khách còn bao nhiêu lượt quay.">Enter a phone number to see the customer's remaining spins.</span></div></div>
    </div>
  </div>
</section>

<div class="d-flex flex-wrap align-items-center gap-2 mb-3"><h2 class="m-0 fs-3 fw-bold me-auto" data-vi="Chương trình đang mở">Open campaigns</h2>
  <div class="btn-group" id="game-picker" role="group" aria-label="Choose a game"></div>
  <button class="btn btn-outline-primary btn-sm" id="refresh-campaigns" type="button"><i class="ti ti-refresh me-1"></i><span data-vi="Làm mới">Refresh</span></button></div>
<div class="row row-cards mb-4" id="campaign-list"><div class="text-secondary" data-vi="Đang tải chương trình...">Loading campaigns...</div></div>

<section class="card">
  <div class="card-header"><h3 class="card-title"><i class="ti ti-trophy me-2"></i><span data-vi="Phần thưởng của khách &amp; giao thưởng">Customer prizes & handover</span></h3></div>
  <div class="card-body" id="reward-result"><div class="empty-state"><i class="ti ti-gift-off"></i><span data-vi="Kiểm tra một khách để xem các giải đã trúng.">Check a customer to see the prizes they won.</span></div></div>
</section>

<div class="modal modal-blur fade" id="spin-modal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
  <div class="modal-header"><h3 class="modal-title" id="spin-title" data-vi="Trò chơi may mắn">Lucky game</h3><button type="button" class="btn-close" data-bs-dismiss="modal" id="spin-close"></button></div>
  <div class="modal-body text-center py-4 px-4">
    <div id="wheel-mount" class="mb-4 pt-3"></div>
    <div class="result-title" id="spin-result" data-vi="Đang xác nhận lượt quay...">Confirming the spin...</div>
    <div class="text-secondary mt-1" id="spin-result-note" data-vi="Kết quả do máy chủ quyết định trước khi vòng quay dừng.">The server decides the result before the wheel stops.</div>
    <button class="btn btn-grad mt-3 d-none" id="spin-again" type="button"><i class="ti ti-refresh-dot me-1"></i><span data-vi="Chơi tiếp">Play again</span></button>
  </div>
</div></div></div>
</template>
<script>
(async () => {
  await requireAuth();
  renderLayout('rewards', T('Reward spins', 'Quay thưởng'), T('Shared spin campaigns — join and spin for customers right at the counter.', 'Chương trình quay thưởng chung — cửa hàng tham gia và quay cho khách ngay tại quầy.'));
  document.getElementById('content').append(document.getElementById('tpl').content.cloneNode(true));
  applyI18n(); applyCurrency();
  const $ = id => document.getElementById(id);
  const GAME_KEY = 'loyal.game';
  let mode = 'wheel';
  try { const saved = localStorage.getItem(GAME_KEY); if (GAMES[saved]) mode = saved; } catch { /* không có localStorage: dùng mặc định */ }
  let campaigns = new Map(), customer = null, spins = { available: 0, campaigns: [] }, spinning = false, lastCampaign = null;
  const spinsFor = id => spins.campaigns.find(c => c.campaign_id === id)?.available || 0;

  function statusLine() {
    if (!customer) return;
    $('customer-status').innerHTML = spins.available
      ? `<div class="d-flex align-items-center gap-3"><span class="avatar avatar-md avatar-grad rounded-circle">${esc(initials(customer))}</span><div><div class="fw-bold">${esc(customer)}</div><div><span class="pill pill-earn fs-6">🎁 ${spins.available} ${T(plural(spins.available, 'spin', 'spins'), 'lượt quay')}</span></div></div></div>`
      : `<div class="d-flex align-items-center gap-3"><span class="avatar avatar-md rounded-circle">${esc(initials(customer))}</span><div><div class="fw-bold">${esc(customer)}</div><div class="text-secondary">${T('No spins yet. <a href="customers.html">Add a receipt</a> so the customer earns spins (once you have joined a campaign).', 'Chưa có lượt quay. <a href="customers.html">Cộng điểm hóa đơn</a> để khách nhận lượt (nếu đã tham gia chương trình).')}</div></div></div>`;
  }

  function campaignCard(c) {
    const prizes = (c.prizes || []).map(p => `<span class="prize-chip">${p.prize_type === 'none' ? '🍀' : '🎁'} ${esc(p.name)}</span>`).join('');
    const n = spinsFor(c.id);
    const action = !c.joined
      ? `<button class="btn btn-primary join-campaign" data-campaign="${esc(c.id)}" type="button"><i class="ti ti-circle-plus me-1"></i>${T('Join campaign', 'Tham gia chương trình')}</button>`
      : `<button class="btn btn-grad spin-btn" data-campaign="${esc(c.id)}" type="button" ${n ? '' : 'disabled'}><i class="ti ${GAMES[mode].icon} me-1"></i>${customer ? (n ? `${GAMES[mode].cta} (${n} ${T('left', 'lượt')})` : T('No spins left', 'Khách hết lượt')) : T('Check a customer to play', 'Kiểm tra khách để chơi')}</button>`;
    const until = c.ends_at ? `${T('until', 'đến')} ${fmtDay(c.ends_at)}` : T('no end date', 'không giới hạn thời gian');
    return `<div class="col-md-6 col-xl-4"><div class="card camp"><div class="camp-head"><h3>${esc(c.name)}</h3><div class="small">${c.joined ? `<i class="ti ti-circle-check me-1"></i>${T('Joined', 'Đã tham gia')} · ` : ''}${until}</div></div>
      <div class="camp-body"><p class="text-secondary mb-0">${esc(c.description || T('Network-wide spin campaign', 'Chương trình quay thưởng toàn hệ thống'))}</p>
      <div>${prizes || `<span class="text-secondary">${T('Prizes to be announced', 'Giải thưởng sẽ được công bố')}</span>`}</div>
      <div class="small text-secondary"><i class="ti ti-receipt me-1"></i>${T(`1 spin per ${fmtMoney(c.spend_per_spin_minor || 0, c.currency || 'VND')} · up to ${c.max_spins_per_sale} per receipt`, `Mỗi ${fmtMoney(c.spend_per_spin_minor || 0, c.currency || 'VND')} nhận 1 lượt · tối đa ${c.max_spins_per_sale} lượt/hóa đơn`)}</div>
      <div class="mt-auto">${action}</div></div></div></div>`;
  }
  function renderCampaigns() {
    $('campaign-list').innerHTML = [...campaigns.values()].map(campaignCard).join('') || `<div class="col-12"><div class="card"><div class="empty-state"><i class="ti ti-calendar-off"></i>${T(`No open campaigns for ${STORE_CURRENCY} stores.`, `Chưa có chương trình nào đang mở cho cửa hàng dùng ${STORE_CURRENCY}.`)}<br><span class="small">${T('Administrators create campaigns on the <a href="admin.html" target="_blank">admin page</a>.', 'Quản trị viên tạo chương trình ở <a href="admin.html" target="_blank">trang quản trị</a>.')}</span></div></div></div>`;
  }
  async function loadCampaigns() {
    try { const w = await LoyaltyAPI.campaigns(); campaigns = new Map(w.campaigns.map(c => [c.id, c])); renderCampaigns(); }
    catch (e) { $('campaign-list').innerHTML = `<div class="text-danger">${esc(e.message)}</div>`; }
  }

  async function loadRewards() {
    const data = await LoyaltyAPI.rewards(customer);
    $('reward-result').innerHTML = data.rewards.map(r => `<div class="activity"><span class="avatar avatar-md ${r.claim ? 'tone-green' : 'tone-amber'} rounded-circle"><i class="ti ${r.claim ? 'ti-circle-check' : 'ti-gift'}"></i></span><div class="me-auto"><div class="fw-bold">${esc(r.prize_name)}</div><div class="small text-secondary">${T('Won', 'Trúng lúc')} ${esc(fmtDate(r.spun_at || r.created))}${r.claim ? ` · ${T('delivered', 'đã giao')} ${esc(fmtShort(r.claim.claimed_at))}` : ''}</div></div>${r.claim ? `<span class="pill pill-earn">${T('Delivered', 'Đã giao')}</span>` : `<button class="btn btn-sm btn-warning claim-reward" data-result="${esc(r.id)}">${T('Mark delivered', 'Xác nhận đã giao')}</button>`}</div>`).join('')
      || `<div class="empty-state"><i class="ti ti-gift-off"></i>${T('This customer has not won anything yet.', 'Khách chưa trúng giải nào.')}</div>`;
  }
  async function checkCustomer(ref) {
    customer = ref;
    spins = await LoyaltyAPI.spinsFor(ref);
    statusLine(); renderCampaigns();
    await loadRewards();
  }
  onSubmit('customer-form', () => checkCustomer($('customer-ref').value.trim()));

  $('reward-result').addEventListener('click', async event => {
    const button = event.target.closest('.claim-reward'); if (!button) return;
    if (!confirm(T('Confirm the store has handed the correct prize to the customer?', 'Xác nhận cửa hàng đã giao đúng phần thưởng cho khách?'))) return;
    button.disabled = true;
    try { await LoyaltyAPI.claim(button.dataset.result, 'Confirmed in Loyal SchoolsAI'); showAlert(T('Prize handover recorded.', 'Đã ghi nhận giao thưởng.')); await loadRewards(); }
    catch (e) { showAlert(e.message, 'danger'); button.disabled = false; }
  });

  function renderPicker() {
    $('game-picker').innerHTML = Object.entries(GAMES).map(([key, g]) => `<button type="button" class="btn btn-sm ${key === mode ? 'btn-primary' : 'btn-outline-primary'}" data-game="${key}"><i class="ti ${g.icon} me-1"></i>${g.label}</button>`).join('');
  }
  $('game-picker').addEventListener('click', e => {
    const b = e.target.closest('[data-game]'); if (!b) return;
    mode = b.dataset.game;
    try { localStorage.setItem(GAME_KEY, mode); } catch { /* bỏ qua */ }
    renderPicker(); renderCampaigns();
  });

  async function runSpin(campaignId) {
    if (spinning) return;
    const campaign = campaigns.get(campaignId); if (!campaign) throw new Error(T('This campaign is no longer available.', 'Chương trình không còn khả dụng.'));
    const prizes = campaign.prizes || [], game = mode;
    spinning = true; lastCampaign = campaignId;
    $('spin-title').textContent = `${campaign.name} · ${GAMES[game].label}`;
    $('spin-result-note').textContent = ''; $('spin-again').classList.add('d-none');
    const controller = createGame(game, $('wheel-mount'), prizes);
    $('spin-result').textContent = controller.hint || T('Spinning...', 'Đang quay...');
    const modal = bootstrap.Modal.getOrCreateInstance($('spin-modal'), { backdrop: 'static', keyboard: false });
    $('spin-close').classList.remove('d-none'); // còn chờ khách thao tác thì cho phép đóng (hủy)
    const onHidden = () => controller.cancel();
    $('spin-modal').addEventListener('hidden.bs.modal', onHidden, { once: true });
    modal.show();
    try {
      await controller.start();                         // chờ khách chọn thẻ / bấm tung / kéo cần
      $('spin-modal').removeEventListener('hidden.bs.modal', onHidden);
      $('spin-close').classList.add('d-none'); $('spin-result').textContent = T('Spinning...', 'Đang quay...');
      const { result } = await LoyaltyAPI.spin({ campaign_id: campaignId, customer_ref: customer, game, idempotency_key: `spin:${campaignId}:${customer}:${crypto.randomUUID()}` });
      let index = prizes.findIndex(p => p.id === result.prize_id);
      if (index < 0) index = Math.max(0, prizes.findIndex(p => p.name === result.prize_name));
      await controller.reveal(index, result);
      const won = result.status === 'won';
      $('spin-result').textContent = won ? `🎉 ${result.prize_name}` : T('Better luck next time! 🍀', 'Chúc may mắn lần sau! 🍀');
      $('spin-result-note').textContent = won ? T('Prize recorded — remember to hand it to the customer.', 'Phần thưởng đã được ghi nhận — nhớ bàn giao cho khách.') : T('Play recorded.', 'Lượt chơi đã được ghi nhận.');
      if (won) launchConfetti();
      spins = await LoyaltyAPI.spinsFor(customer); statusLine(); renderCampaigns(); await loadRewards();
      if (spinsFor(campaignId) > 0) $('spin-again').classList.remove('d-none');
    } catch (e) {
      if (!e.cancelled) { $('spin-result').textContent = T("Can't play yet", 'Chưa thể chơi'); $('spin-result-note').textContent = e.message; }
    } finally { spinning = false; $('spin-close').classList.remove('d-none'); }
  }
  $('spin-again').addEventListener('click', () => runSpin(lastCampaign).catch(e => showAlert(e.message, 'danger')));

  $('campaign-list').addEventListener('click', async event => {
    const join = event.target.closest('.join-campaign'), spin = event.target.closest('.spin-btn');
    const button = join || spin; if (!button) return;
    button.disabled = true;
    try {
      if (join) { await LoyaltyAPI.join(join.dataset.campaign); showAlert(T('Campaign joined. New qualifying receipts will earn spins automatically.', 'Cửa hàng đã tham gia chương trình. Hóa đơn mới đủ điều kiện sẽ tự nhận lượt quay.')); await loadCampaigns(); }
      else await runSpin(spin.dataset.campaign);
    } catch (e) { showAlert(e.message, 'danger'); button.disabled = false; }
  });
  $('refresh-campaigns').addEventListener('click', loadCampaigns);
  renderPicker();
  await loadProgram().catch(() => {});
  loadCampaigns();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quay thưởng - Loyal SchoolsAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/wheel.js"></script>
  <script src="assets/js/confetti.js"></script>
</head>
<body class="layout-fluid">
<div class="page" id="layout"></div>
<template id="tpl">
<section class="card mb-4">
  <div class="card-body">
    <div class="row g-3 align-items-center">
      <div class="col-lg-5">
        <div class="fw-bold mb-1">Khách sắp quay</div>
        <form id="customer-form" class="input-group"><input id="customer-ref" class="form-control form-control-lg" placeholder="Số điện thoại / mã khách" required inputmode="tel"><button class="btn btn-primary" type="submit"><i class="ti ti-search me-1"></i>Kiểm tra</button></form>
      </div>
      <div class="col-lg-7" id="customer-status"><div class="text-secondary"><i class="ti ti-info-circle me-1"></i>Nhập số điện thoại để xem khách còn bao nhiêu lượt quay.</div></div>
    </div>
  </div>
</section>

<div class="d-flex align-items-center mb-3"><h2 class="m-0 fs-3 fw-bold">Chương trình đang mở</h2><button class="btn btn-outline-primary btn-sm ms-auto" id="refresh-campaigns" type="button"><i class="ti ti-refresh me-1"></i>Làm mới</button></div>
<div class="row row-cards mb-4" id="campaign-list"><div class="text-secondary">Đang tải chương trình...</div></div>

<section class="card">
  <div class="card-header"><h3 class="card-title"><i class="ti ti-trophy me-2"></i>Phần thưởng của khách & giao thưởng</h3></div>
  <div class="card-body" id="reward-result"><div class="empty-state"><i class="ti ti-gift-off"></i>Kiểm tra một khách để xem các giải đã trúng.</div></div>
</section>

<div class="modal modal-blur fade" id="spin-modal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
  <div class="modal-header"><h3 class="modal-title" id="spin-title">Vòng quay may mắn</h3><button type="button" class="btn-close" data-bs-dismiss="modal" id="spin-close"></button></div>
  <div class="modal-body text-center py-4 px-4">
    <div id="wheel-mount" class="mb-4 pt-3"></div>
    <div class="result-title" id="spin-result">Đang xác nhận lượt quay...</div>
    <div class="text-secondary mt-1" id="spin-result-note">Kết quả do máy chủ quyết định trước khi vòng quay dừng.</div>
    <button class="btn btn-grad mt-3 d-none" id="spin-again" type="button"><i class="ti ti-refresh-dot me-1"></i>Quay tiếp</button>
  </div>
</div></div></div>
</template>
<script>
(async () => {
  await requireAuth();
  renderLayout('rewards', 'Quay thưởng', 'Chương trình quay thưởng chung — cửa hàng tham gia và quay cho khách ngay tại quầy.');
  document.getElementById('content').append(document.getElementById('tpl').content.cloneNode(true));
  const $ = id => document.getElementById(id);
  let campaigns = new Map(), customer = null, spins = { available: 0, campaigns: [] }, spinning = false, lastCampaign = null;
  const spinsFor = id => spins.campaigns.find(c => c.campaign_id === id)?.available || 0;

  function statusLine() {
    if (!customer) return;
    $('customer-status').innerHTML = spins.available
      ? `<div class="d-flex align-items-center gap-3"><span class="avatar avatar-md avatar-grad rounded-circle">${esc(initials(customer))}</span><div><div class="fw-bold">${esc(customer)}</div><div><span class="pill pill-earn fs-6">🎁 ${spins.available} lượt quay</span></div></div></div>`
      : `<div class="d-flex align-items-center gap-3"><span class="avatar avatar-md rounded-circle">${esc(initials(customer))}</span><div><div class="fw-bold">${esc(customer)}</div><div class="text-secondary">Chưa có lượt quay. <a href="customers.html">Cộng điểm hóa đơn</a> để khách nhận lượt (nếu đã tham gia chương trình).</div></div></div>`;
  }

  function campaignCard(c) {
    const prizes = (c.prizes || []).map(p => `<span class="prize-chip">${p.prize_type === 'none' ? '🍀' : '🎁'} ${esc(p.name)}</span>`).join('');
    const n = spinsFor(c.id);
    const action = !c.joined
      ? `<button class="btn btn-primary join-campaign" data-campaign="${esc(c.id)}" type="button"><i class="ti ti-circle-plus me-1"></i>Tham gia chương trình</button>`
      : `<button class="btn btn-grad spin-btn" data-campaign="${esc(c.id)}" type="button" ${n ? '' : 'disabled'}><i class="ti ti-rotate-clockwise-2 me-1"></i>${customer ? (n ? `Quay ngay (${n} lượt)` : 'Khách hết lượt') : 'Kiểm tra khách để quay'}</button>`;
    const until = c.ends_at ? `đến ${new Date(c.ends_at).toLocaleDateString('vi-VN')}` : 'không giới hạn thời gian';
    return `<div class="col-md-6 col-xl-4"><div class="card camp"><div class="camp-head"><h3>${esc(c.name)}</h3><div class="small">${c.joined ? '<i class="ti ti-circle-check me-1"></i>Đã tham gia · ' : ''}${until}</div></div>
      <div class="camp-body"><p class="text-secondary mb-0">${esc(c.description || 'Chương trình quay thưởng toàn hệ thống')}</p>
      <div>${prizes || '<span class="text-secondary">Giải thưởng sẽ được công bố</span>'}</div>
      <div class="small text-secondary"><i class="ti ti-receipt me-1"></i>Mỗi ${money.format(Number(c.spend_per_spin_minor || 0))} ₫ nhận 1 lượt · tối đa ${c.max_spins_per_sale} lượt/hóa đơn</div>
      <div class="mt-auto">${action}</div></div></div></div>`;
  }
  function renderCampaigns() {
    $('campaign-list').innerHTML = [...campaigns.values()].map(campaignCard).join('') || '<div class="col-12"><div class="card"><div class="empty-state"><i class="ti ti-calendar-off"></i>Chưa có chương trình nào đang mở.<br><span class="small">Quản trị viên tạo chương trình ở <a href="admin.html" target="_blank">trang quản trị</a>.</span></div></div></div>';
  }
  async function loadCampaigns() {
    try { const w = await LoyaltyAPI.campaigns(); campaigns = new Map(w.campaigns.map(c => [c.id, c])); renderCampaigns(); }
    catch (e) { $('campaign-list').innerHTML = `<div class="text-danger">${esc(e.message)}</div>`; }
  }

  async function loadRewards() {
    const data = await LoyaltyAPI.rewards(customer);
    $('reward-result').innerHTML = data.rewards.map(r => `<div class="activity"><span class="avatar avatar-md ${r.claim ? 'tone-green' : 'tone-amber'} rounded-circle"><i class="ti ${r.claim ? 'ti-circle-check' : 'ti-gift'}"></i></span><div class="me-auto"><div class="fw-bold">${esc(r.prize_name)}</div><div class="small text-secondary">Trúng lúc ${esc(fmtDate(r.spun_at || r.created))}${r.claim ? ` · đã giao ${esc(fmtShort(r.claim.claimed_at))}` : ''}</div></div>${r.claim ? '<span class="pill pill-earn">Đã giao</span>' : `<button class="btn btn-sm btn-warning claim-reward" data-result="${esc(r.id)}">Xác nhận đã giao</button>`}</div>`).join('')
      || '<div class="empty-state"><i class="ti ti-gift-off"></i>Khách chưa trúng giải nào.</div>';
  }
  async function checkCustomer(ref) {
    customer = ref;
    spins = await LoyaltyAPI.spinsFor(ref);
    statusLine(); renderCampaigns();
    await loadRewards();
  }
  onSubmit('customer-form', () => checkCustomer($('customer-ref').value.trim()));

  $('reward-result').addEventListener('click', async event => {
    const button = event.target.closest('.claim-reward'); if (!button) return;
    if (!confirm('Xác nhận cửa hàng đã giao đúng phần thưởng cho khách?')) return;
    button.disabled = true;
    try { await LoyaltyAPI.claim(button.dataset.result, 'Xác nhận tại Loyal SchoolsAI'); showAlert('Đã ghi nhận giao thưởng.'); await loadRewards(); }
    catch (e) { showAlert(e.message, 'danger'); button.disabled = false; }
  });

  async function runSpin(campaignId) {
    if (spinning) return;
    const campaign = campaigns.get(campaignId); if (!campaign) throw new Error('Chương trình không còn khả dụng.');
    spinning = true; lastCampaign = campaignId;
    $('spin-title').textContent = campaign.name;
    $('spin-result').textContent = 'Đang quay...'; $('spin-result-note').textContent = ''; $('spin-again').classList.add('d-none');
    mountWheel($('wheel-mount'), campaign.prizes || []);
    bootstrap.Modal.getOrCreateInstance($('spin-modal'), { backdrop: 'static', keyboard: false }).show();
    $('spin-close').classList.add('d-none');
    try {
      const { result } = await LoyaltyAPI.spin({ campaign_id: campaignId, customer_ref: customer, idempotency_key: `spin:${campaignId}:${customer}:${crypto.randomUUID()}` });
      const prizes = campaign.prizes || [];
      let index = prizes.findIndex(p => p.id === result.prize_id);
      if (index < 0) index = Math.max(0, prizes.findIndex(p => p.name === result.prize_name));
      await spinWheelTo($('wheel-mount'), prizes, index);
      const won = result.status === 'won';
      $('spin-result').textContent = won ? `🎉 ${result.prize_name}` : 'Chúc may mắn lần sau! 🍀';
      $('spin-result-note').textContent = won ? 'Phần thưởng đã được ghi nhận — nhớ bàn giao cho khách.' : 'Lượt quay đã được ghi nhận.';
      if (won) launchConfetti();
      spins = await LoyaltyAPI.spinsFor(customer); statusLine(); renderCampaigns(); await loadRewards();
      if (spinsFor(campaignId) > 0) $('spin-again').classList.remove('d-none');
    } catch (e) {
      $('spin-result').textContent = 'Chưa thể quay'; $('spin-result-note').textContent = e.message;
    } finally { spinning = false; $('spin-close').classList.remove('d-none'); }
  }
  $('spin-again').addEventListener('click', () => runSpin(lastCampaign).catch(e => showAlert(e.message, 'danger')));

  $('campaign-list').addEventListener('click', async event => {
    const join = event.target.closest('.join-campaign'), spin = event.target.closest('.spin-btn');
    const button = join || spin; if (!button) return;
    button.disabled = true;
    try {
      if (join) { await LoyaltyAPI.join(join.dataset.campaign); showAlert('Cửa hàng đã tham gia chương trình. Hóa đơn mới đủ điều kiện sẽ tự nhận lượt quay.'); await loadCampaigns(); }
      else await runSpin(spin.dataset.campaign);
    } catch (e) { showAlert(e.message, 'danger'); button.disabled = false; }
  });
  $('refresh-campaigns').addEventListener('click', loadCampaigns);
  loadCampaigns();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
</body>
</html>

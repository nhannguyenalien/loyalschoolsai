<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản trị Reward World - Loyal SchoolsAI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <script src="assets/js/ui.js"></script>
</head>
<body>
<main class="page-body"><div class="container-xl py-4">
  <div class="d-flex align-items-start mb-4">
    <div><h1 class="mb-1">Reward World — quản trị hệ thống</h1><div class="text-secondary">Tạo thể lệ và giải thưởng một lần; cửa hàng chỉ chọn tham gia.</div></div>
    <button id="logout-btn" class="btn btn-outline-secondary ms-auto d-none" type="button"><i class="ti ti-logout me-1"></i>Đăng xuất</button>
  </div>
  <div id="alert"></div>

  <section id="login-screen" class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card">
    <form id="login-form" class="card-body">
      <div class="mb-3"><label class="form-label">Admin secret</label><input id="secret" type="password" class="form-control" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100" type="submit">Vào quản trị</button>
      <div class="form-hint mt-3">Giá trị biến <code>ADMIN_SECRET</code> của Pages project. Chỉ lưu trong tab này.</div>
    </form>
  </div></div></section>

  <section id="workspace" class="d-none">
    <div class="card mb-4">
      <div class="card-header"><h3 class="card-title"><i class="ti ti-confetti me-2"></i><span id="form-title">Tạo chương trình chung</span></h3></div>
      <form id="campaign-form" class="card-body">
        <input id="campaign-id" type="hidden">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Tên chương trình</label><input id="c-name" class="form-control" maxlength="200" required></div>
          <div class="col-md-3"><label class="form-label">Bắt đầu</label><input id="c-start" type="datetime-local" class="form-control"></div>
          <div class="col-md-3"><label class="form-label">Kết thúc</label><input id="c-end" type="datetime-local" class="form-control"></div>
          <div class="col-md-6"><label class="form-label">Mô tả / thể lệ ngắn</label><textarea id="c-desc" class="form-control" rows="2" maxlength="2000"></textarea></div>
          <div class="col-md-2"><label class="form-label">Chi tiêu / lượt (VND)</label><input id="c-spend" type="number" min="1" value="100000" class="form-control" required></div>
          <div class="col-md-2"><label class="form-label">Tối đa / hóa đơn</label><input id="c-max" type="number" min="1" value="1" class="form-control" required></div>
          <div class="col-md-2"><label class="form-label">Trạng thái</label><select id="c-status" class="form-select"><option value="draft">Bản nháp</option><option value="active">Đang chạy</option><option value="paused">Tạm dừng</option><option value="ended">Kết thúc</option></select></div>
        </div>
        <div class="mt-3 d-flex gap-2"><button class="btn btn-success" type="submit"><i class="ti ti-device-floppy me-1"></i>Lưu chương trình</button><button id="cancel-edit" class="btn btn-outline-secondary d-none" type="button">Hủy sửa</button></div>
      </form>
    </div>
    <div class="d-flex align-items-center mb-3"><h2 class="m-0">Các chương trình</h2><button id="refresh-btn" class="btn btn-outline-primary btn-sm ms-auto" type="button"><i class="ti ti-refresh me-1"></i>Làm mới</button></div>
    <div id="campaigns"><div class="text-secondary">Đang tải...</div></div>
  </section>
</div></main>
<script>
const KEY = 'loyal_admin_secret';
const STATUS = { draft: 'Bản nháp', active: 'Đang chạy', paused: 'Tạm dừng', ended: 'Kết thúc' };
const PRIZE_TYPES = { none: 'Không trúng', points: 'Điểm', voucher: 'Voucher', product: 'Sản phẩm', partner_code: 'Mã đối tác' };
let campaigns = [];
const $ = id => document.getElementById(id);
const secret = () => sessionStorage.getItem(KEY) || '';
const inputDate = v => v ? new Date(new Date(v).getTime() - new Date(v).getTimezoneOffset() * 60000).toISOString().slice(0, 16) : '';

async function adminFetch(path, options = {}) {
  const res = await fetch(`/api/v1/admin/reward-world${path}`, { ...options, headers: { 'Content-Type': 'application/json', 'X-Admin-Secret': secret() } });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401) { sessionStorage.removeItem(KEY); showLogin(); throw new Error(body.error || 'Sai admin secret.'); }
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}
const send = (method, path, data) => adminFetch(path, { method, body: JSON.stringify(data) });

function showLogin() { $('login-screen').classList.remove('d-none'); $('workspace').classList.add('d-none'); $('logout-btn').classList.add('d-none'); }
function showWorkspace() { $('login-screen').classList.add('d-none'); $('workspace').classList.remove('d-none'); $('logout-btn').classList.remove('d-none'); load(); }

function resetForm() {
  $('campaign-form').reset(); $('campaign-id').value = ''; $('c-spend').value = 100000; $('c-max').value = 1;
  $('form-title').textContent = 'Tạo chương trình chung'; $('cancel-edit').classList.add('d-none');
}

function prizeRow(p) {
  return `<div class="prize-row d-flex align-items-center border-bottom py-2"><div class="me-auto"><b>${esc(p.name)}</b> <span class="badge bg-purple-lt">${esc(PRIZE_TYPES[p.prize_type] || p.prize_type)}</span>
    <div class="small text-secondary">Trọng số ${esc(p.weight)} · tối đa ${Number(p.max_wins) ? esc(p.max_wins) : '∞'} lần trúng · ${esc(p.status)}</div></div>
    <button class="btn btn-sm btn-outline-secondary toggle-prize" data-id="${esc(p.id)}" data-status="${p.status === 'active' ? 'paused' : 'active'}">${p.status === 'active' ? 'Tạm dừng' : 'Bật lại'}</button></div>`;
}
function campaignCard(c) {
  return `<article class="card mb-3"><div class="card-header"><div><h3 class="card-title">${esc(c.name)}</h3><div class="small text-secondary">${esc(c.description || 'Chưa có mô tả')}</div></div>
    <span class="badge ms-auto">${esc(STATUS[c.status] || c.status)}</span></div>
    <div class="card-body"><div class="small text-secondary mb-3">Mỗi ${money.format(Number(c.spend_per_spin_minor))} ₫ nhận 1 lượt · tối đa ${esc(c.max_spins_per_sale)} lượt/hóa đơn · ${c.starts_at ? esc(fmtDate(c.starts_at)) : 'ngay'} → ${c.ends_at ? esc(fmtDate(c.ends_at)) : 'không giới hạn'}</div>
    ${(c.prizes || []).map(prizeRow).join('') || '<div class="text-secondary mb-2">Chưa có giải thưởng.</div>'}
    <form class="prize-form row g-2 mt-2" data-campaign="${esc(c.id)}">
      <div class="col-md-3"><input name="name" class="form-control" placeholder="Tên giải" required></div>
      <div class="col-md-2"><select name="prize_type" class="form-select">${Object.entries(PRIZE_TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
      <div class="col-md-2"><input name="weight" type="number" min="0.0001" step="any" value="1" class="form-control" title="Trọng số" required></div>
      <div class="col-md-2"><input name="max_wins" type="number" min="0" value="0" class="form-control" title="Tối đa lần trúng (0 = không giới hạn)"></div>
      <div class="col-md-3"><button class="btn btn-outline-success w-100" type="submit"><i class="ti ti-plus me-1"></i>Thêm giải</button></div>
    </form></div>
    <div class="card-footer"><button class="btn btn-sm btn-outline-primary edit-campaign" data-id="${esc(c.id)}">Sửa</button></div></article>`;
}

async function load() {
  try { campaigns = (await adminFetch('/campaigns')).campaigns; $('campaigns').innerHTML = campaigns.map(campaignCard).join('') || '<div class="text-secondary">Chưa có chương trình.</div>'; }
  catch (e) { showAlert(e.message, 'danger'); }
}

$('login-form').addEventListener('submit', e => { e.preventDefault(); sessionStorage.setItem(KEY, $('secret').value); showWorkspace(); });
$('logout-btn').onclick = () => { sessionStorage.removeItem(KEY); showLogin(); };
$('refresh-btn').onclick = load;
$('cancel-edit').onclick = resetForm;

onSubmit('campaign-form', async () => {
  const id = $('campaign-id').value;
  const data = {
    name: $('c-name').value.trim(), description: $('c-desc').value.trim(), status: $('c-status').value,
    starts_at: $('c-start').value ? new Date($('c-start').value).toISOString() : '',
    ends_at: $('c-end').value ? new Date($('c-end').value).toISOString() : '',
    spend_per_spin_minor: Number($('c-spend').value), max_spins_per_sale: Number($('c-max').value)
  };
  if (id) await send('PATCH', `/campaigns/${encodeURIComponent(id)}`, data); else await send('POST', '/campaigns', data);
  showAlert('Đã lưu chương trình.'); resetForm(); await load();
});

$('campaigns').addEventListener('click', async event => {
  const edit = event.target.closest('.edit-campaign'), toggle = event.target.closest('.toggle-prize');
  try {
    if (edit) {
      const c = campaigns.find(x => x.id === edit.dataset.id); if (!c) return;
      $('campaign-id').value = c.id; $('c-name').value = c.name; $('c-desc').value = c.description || '';
      $('c-start').value = inputDate(c.starts_at); $('c-end').value = inputDate(c.ends_at);
      $('c-spend').value = c.spend_per_spin_minor; $('c-max').value = c.max_spins_per_sale; $('c-status').value = c.status;
      $('form-title').textContent = 'Sửa chương trình'; $('cancel-edit').classList.remove('d-none'); scrollTo({ top: 0, behavior: 'smooth' });
    }
    if (toggle) { await send('PATCH', `/prizes/${encodeURIComponent(toggle.dataset.id)}`, { status: toggle.dataset.status }); await load(); }
  } catch (e) { showAlert(e.message, 'danger'); }
});
$('campaigns').addEventListener('submit', async event => {
  if (!event.target.matches('.prize-form')) return;
  event.preventDefault();
  const f = new FormData(event.target);
  try {
    await send('POST', `/campaigns/${encodeURIComponent(event.target.dataset.campaign)}/prizes`,
      { name: f.get('name').trim(), prize_type: f.get('prize_type'), weight: Number(f.get('weight')), max_wins: Number(f.get('max_wins') || 0) });
    showAlert('Đã thêm giải thưởng.'); await load();
  } catch (e) { showAlert(e.message, 'danger'); }
});

if (secret()) showWorkspace(); else showLogin();
</script>
</body>
</html>

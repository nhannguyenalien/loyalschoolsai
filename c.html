<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Điểm thưởng của bạn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/confetti.js"></script>
  <script src="/assets/js/wheel.js"></script>
  <script src="/assets/js/minigames.js"></script>
  <style>
    body { background: var(--app-bg); }
    .cwrap { max-width: 520px; margin: 0 auto; padding: 0 16px 48px; }
    .chero { background: var(--brand-grad); color: #fff; margin: 0 -16px 16px; padding: 28px 20px 56px; text-align: center; border-radius: 0 0 28px 28px; }
    .chero h1 { font-size: 1.35rem; font-weight: 800; margin: 0 0 4px; }
    .chero p { margin: 0; opacity: .9; font-size: .9rem; }
    .cmain { margin-top: -40px; }
    .balance { font-size: 3rem; font-weight: 800; line-height: 1; background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .item { display: flex; align-items: center; gap: .75rem; padding: .75rem 0; border-bottom: 1px solid #eef0f8; }
    .item:last-child { border-bottom: 0; }
    .item .grow { flex: 1; min-width: 0; }
    #spin-stage { text-align: center; }
  </style>
</head>
<body>
<div class="cwrap">
  <div class="chero"><h1 id="store-name">Đang tải...</h1><p id="store-sub">Tích điểm – điểm danh – nhận quà</p></div>
  <div class="cmain">
    <div id="alert"></div>
    <section class="card mb-3"><div class="card-body">
      <form id="phone-form" class="input-group input-group-lg">
        <input id="phone" class="form-control" type="tel" inputmode="tel" autocomplete="tel" placeholder="Số điện thoại" required>
        <button class="btn btn-grad" type="submit">Xem điểm</button>
      </form>
      <div class="form-hint mt-2 small text-secondary">Dùng đúng số điện thoại bạn đã đưa cho cửa hàng khi mua hàng.</div>
    </div></section>
    <div id="me" class="d-none"></div>
    <section class="card mb-3 d-none" id="how"><div class="card-body small text-secondary" id="how-text"></div></section>
  </div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const slug = new URLSearchParams(location.search).get('s') || '';
  const API = `/api/v1/public/${encodeURIComponent(slug)}`;
  let store = null, phone = '', current = null;
  const save = v => { try { localStorage.setItem('ls_phone_' + slug, v); } catch {} };
  const load = () => { try { return localStorage.getItem('ls_phone_' + slug) || ''; } catch { return ''; } };

  async function api(path, body) {
    const res = await fetch(API + path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Có lỗi xảy ra, vui lòng thử lại.');
    return data;
  }
  const rewardText = m => m.reward_label || (m.reward_type === 'points' ? `+${money.format(m.reward_points)} điểm` : m.reward_type === 'spin' ? '1 lượt quay' : 'Quà tặng');

  function missionRows(list) {
    return list.map(m => {
      const pct = Math.min(100, Math.round(m.current / Math.max(1, m.target) * 100));
      const action = m.claimed ? '<span class="badge bg-green-lt">Đã nhận</span>'
        : m.completed ? `<button class="btn btn-sm btn-grad claim" data-id="${esc(m.id)}">Nhận</button>`
        : `<span class="small text-secondary">${money.format(m.current)}/${money.format(m.target)}</span>`;
      return `<div class="item"><div class="grow"><div class="fw-bold">${esc(m.name)}</div><div class="small text-secondary mb-1">${esc(rewardText(m))}</div><div class="progress progress-sm"><div class="progress-bar" style="width:${pct}%"></div></div></div>${action}</div>`;
    }).join('');
  }

  function render(me) {
    current = me;
    const checkin = me.checkin, next = checkin.next_milestone;
    const spinTotal = me.spins.reduce((s, c) => s + c.available, 0);
    const campaigns = Object.fromEntries(store.campaigns.map(c => [c.id, c]));
    const spinRows = me.spins.filter(c => campaigns[c.campaign_id]).map(c => `<div class="item"><span class="avatar tone-amber rounded-circle"><i class="ti ti-gift"></i></span><div class="grow"><div class="fw-bold">${esc(campaigns[c.campaign_id].name)}</div><div class="small text-secondary">Bạn có ${c.available} lượt quay</div></div><button class="btn btn-grad spin" data-id="${esc(c.campaign_id)}">Quay ngay</button></div>`).join('');
    $('me').innerHTML = `
      <section class="card mb-3 text-center"><div class="card-body">
        <div class="text-secondary">Xin chào, <b>${esc(me.customer.name)}</b></div>
        <div class="balance my-2">${money.format(me.balance)}</div><div class="text-secondary">điểm hiện có</div>
      </div></section>
      <section class="card mb-3"><div class="card-body d-flex align-items-center gap-3">
        <span class="avatar avatar-lg tone-indigo rounded-circle"><i class="ti ti-calendar-check"></i></span>
        <div class="me-auto"><div class="fw-bold">Điểm danh mỗi ngày</div><div class="small text-secondary">Chuỗi hiện tại: <b>${checkin.streak}</b> ngày${next ? ` · còn ${next.days - checkin.streak} ngày nữa nhận +${money.format(next.points)} điểm` : ''}</div></div>
        <button class="btn ${checkin.checked_in_today ? 'btn-outline-secondary' : 'btn-grad'}" id="checkin-btn" ${checkin.checked_in_today ? 'disabled' : ''}>${checkin.checked_in_today ? 'Đã điểm danh' : `+${store.checkin_points} điểm`}</button>
      </div></section>
      ${spinTotal ? `<section class="card mb-3"><div class="card-header"><h3 class="card-title">🎁 Lượt quay của bạn</h3></div><div class="card-body py-1" id="spin-list">${spinRows}</div><div class="card-body d-none" id="spin-stage"><div id="wheel-mount" class="mb-3"></div><div class="result-title" id="spin-result"></div><button class="btn btn-grad mt-3 d-none" id="spin-done">Xong</button></div></section>` : ''}
      ${me.missions.length ? `<section class="card mb-3"><div class="card-header"><h3 class="card-title">Nhiệm vụ hôm nay</h3></div><div class="card-body py-1">${missionRows(me.missions)}</div></section>` : ''}
      ${me.challenges.length ? `<section class="card mb-3"><div class="card-header"><h3 class="card-title">Thử thách tuần</h3></div><div class="card-body py-1">${missionRows(me.challenges)}</div></section>` : ''}`;
    $('me').classList.remove('d-none');
  }

  async function refresh() { render(await api('/me', { phone })); }

  $('phone-form').addEventListener('submit', async event => {
    event.preventDefault();
    const btn = event.submitter || event.target.querySelector('button[type=submit]'); btn.disabled = true; // requestSubmit() (tự nạp số đã lưu) không có submitter
    phone = $('phone').value.trim();
    try { await refresh(); save(phone); $('alert').innerHTML = ''; }
    catch (e) { $('me').classList.add('d-none'); showAlert(e.message, 'danger'); }
    finally { btn.disabled = false; }
  });

  $('me').addEventListener('click', async event => {
    const checkinBtn = event.target.closest('#checkin-btn'), claimBtn = event.target.closest('.claim'), spinBtn = event.target.closest('.spin');
    try {
      if (checkinBtn) {
        checkinBtn.disabled = true;
        const r = await api('/checkin', { phone });
        showAlert(r.milestone ? `Điểm danh thành công! Chạm mốc ${r.milestone.days} ngày, thưởng thêm ${money.format(r.milestone.points)} điểm 🎉` : `Đã nhận ${money.format(r.points)} điểm. Chuỗi ${r.streak} ngày!`);
        if (r.milestone) launchConfetti();
        await refresh();
      } else if (claimBtn) {
        claimBtn.disabled = true;
        await api(`/missions/${encodeURIComponent(claimBtn.dataset.id)}/claim`, { phone });
        const mission = [...current.missions, ...current.challenges].find(m => m.id === claimBtn.dataset.id) || {};
        showAlert(mission.reward_type === 'points' ? `Đã nhận +${money.format(mission.reward_points)} điểm 🎉`
          : mission.reward_type === 'spin' ? 'Bạn nhận thêm 1 lượt quay 🎉'
          : 'Đã nhận thưởng 🎉 Hãy đưa số điện thoại cho nhân viên để nhận quà tại quầy.');
        launchConfetti();
        await refresh();
      } else if (spinBtn) {
        await spin(store.campaigns.find(c => c.id === spinBtn.dataset.id));
      }
    } catch (e) { showAlert(e.message, 'danger'); if (checkinBtn) checkinBtn.disabled = false; if (claimBtn) claimBtn.disabled = false; }
  });

  async function spin(campaign) {
    $('spin-list').classList.add('d-none'); $('spin-stage').classList.remove('d-none');
    const done = $('spin-done'); done.classList.add('d-none'); $('spin-result').textContent = 'Chúc bạn may mắn...';
    const game = createGame('wheel', $('wheel-mount'), campaign.prizes);
    try {
      await game.start();
      const r = await api('/spin', { phone, campaign_id: campaign.id, request_id: crypto.randomUUID() });
      await game.reveal(Math.max(0, campaign.prizes.findIndex(p => p.id === r.prize.id)), r.prize);
      const lost = r.prize.prize_type === 'none';
      $('spin-result').textContent = lost ? `🍀 ${r.prize.name}` : `🎁 Bạn trúng: ${r.prize.name}`;
      if (!lost) { launchConfetti(); showAlert('Chúc mừng! Hãy đưa số điện thoại cho nhân viên để nhận quà.'); }
    } catch (e) { showAlert(e.message, 'danger'); $('spin-result').textContent = ''; }
    done.classList.remove('d-none');
    done.onclick = () => refresh().catch(err => showAlert(err.message, 'danger'));
  }

  (async () => {
    try {
      store = await api('');
      document.title = `${store.store.name} — Điểm thưởng`;
      $('store-name').textContent = store.store.name;
      if (store.program) {
        $('how').classList.remove('d-none');
        $('how-text').innerHTML = `<b>Cách tích điểm:</b> mỗi ${money.format(store.program.spend_per_point_minor)} ${esc(store.program.currency)} bạn chi tiêu nhận ${store.program.points_per_step} điểm. Điểm danh mỗi ngày +${store.checkin_points} điểm, điểm danh liên tiếp còn có thưởng thêm.`;
      }
      const saved = load();
      if (saved) { $('phone').value = saved; $('phone-form').requestSubmit(); }
    } catch (e) {
      $('store-name').textContent = 'Không tìm thấy cửa hàng';
      $('store-sub').textContent = 'Vui lòng quét lại mã QR tại quầy.';
      $('phone-form').classList.add('d-none');
    }
  })();
})();
</script>
</body>
</html>
